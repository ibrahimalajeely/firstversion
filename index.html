<title>التحدي</title>
<style>:root{--dng-ink:#fff;--bg:#dde2e2;--panel:#eceeed;--ink:#33404a;--muted:#515f69;--line:#c3ccce;--head:#d4dcdc;--brand:#437470;--brand-d:#3a5a5c;--brand-l:#d1dfdd;--accent:#98622c;--danger:#a54a42;--ok:#437a55;--warn:#ebe5ce;--gs-bg:#efe9d4;--gs-head:#dacfae;--gs-line:#d2c8a8;--gs-hov:#e7dfc3;--gb-bg:#e0e9ee;--gb-head:#c5d6df;--gb-line:#b8cad4;--gb-hov:#d5e2e9;--field:#f3f4f2;--shadow:0 1px 2px rgba(30,45,55,.05),0 2px 8px rgba(30,45,55,.03)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--dng-ink:#2b1613;--bg:#1f262b;--panel:#283139;--ink:#cdd5db;--muted:#8795a0;--line:#3a4751;--head:#2e3941;--brand:#67aaa5;--brand-d:#223e41;--brand-l:#27403f;--accent:#d3a06b;--danger:#dd8a80;--ok:#74b88c;--warn:#3a3822;--gs-bg:#312e22;--gs-head:#413d2b;--gs-line:#4a4631;--gs-hov:#3a3727;--gb-bg:#242e37;--gb-head:#2f3e4a;--gb-line:#3a4b59;--gb-hov:#2b3945;--field:#222a30;--shadow:0 1px 2px rgba(0,0,0,.25)}}
:root[data-theme=dark]{--dng-ink:#2b1613;--gs-bg:#312e22;--gs-head:#413d2b;--gs-line:#4a4631;--gs-hov:#3a3727;--gb-bg:#242e37;--gb-head:#2f3e4a;--gb-line:#3a4b59;--gb-hov:#2b3945;--bg:#1f262b;--panel:#283139;--ink:#cdd5db;--muted:#8795a0;--line:#3a4751;--head:#2e3941;--brand:#67aaa5;--brand-d:#223e41;--brand-l:#27403f;--accent:#d3a06b;--danger:#dd8a80;--ok:#74b88c;--warn:#3a3822;--field:#222a30}
:root[data-theme=warm]{--dng-ink:#fff;--gs-bg:#ecdfba;--gs-head:#dccd9e;--gs-line:#cdbf90;--gs-hov:#e4d5a9;--gb-bg:#dbe3da;--gb-head:#c3d0c4;--gb-line:#b4c3b6;--gb-hov:#d0dcd1;--bg:#e2dac6;--panel:#efe8d6;--ink:#3a342a;--muted:#6c624f;--line:#cdc3aa;--head:#e0d8c2;--brand:#55766a;--brand-d:#4a6256;--brand-l:#dbe2d0;--accent:#98622c;--danger:#a24a40;--ok:#48794f;--warn:#e9e0bf;--field:#f5efdf;--shadow:0 1px 2px rgba(60,50,30,.06),0 2px 8px rgba(60,50,30,.03)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-size:calc(14px*var(--fz,1));line-height:var(--lh,1.5);font-weight:var(--fw,400);font-family:var(--ff,Tahoma,"Segoe UI","Noto Sans Arabic",Arial,sans-serif);text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:calc(208px*var(--fz,1)) 1fr;min-height:100vh}
.side{background:var(--brand-d);color:var(--side-ink,#dfe9e7);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.side h1{font-size:calc(15px*var(--fz,1));margin:2px 8px 14px;line-height:1.4;font-weight:700}
.side h1 small{display:block;font-weight:400;opacity:.7;font-size:calc(11px*var(--fz,1))}
.side a{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;color:var(--side-ink,#e6f4f2);text-decoration:none;margin-bottom:2px;cursor:pointer}
.side a:hover{background:rgba(255,255,255,.1)}
.side a.on{background:var(--panel);color:var(--ink);font-weight:700}.side a.on svg{stroke:var(--brand)}
.side .sep{height:1px;background:rgba(255,255,255,.18);margin:10px 6px}
.side svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{padding:18px 22px 40px;min-width:0;background:var(--screen-bg,transparent)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.top h2{margin:0;font-size:calc(19px*var(--fz,1))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:14px}
.grid{display:grid;gap:10px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 14px;text-align:center;cursor:pointer;box-shadow:var(--shadow);transition:.12s;display:flex;flex-direction:column;gap:8px;align-items:center}
.tile:hover{border-color:var(--brand);transform:translateY(-1px)}
.tile svg{width:30px;height:30px;stroke:var(--brand);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-size:calc(15px*var(--fz,1))}.tile span{color:var(--muted);font-size:calc(12px*var(--fz,1))}
.stats{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin:14px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat span{color:var(--muted);font-size:calc(12px*var(--fz,1));display:block}.stat b{font-size:calc(19px*var(--fz,1));font-variant-numeric:tabular-nums}
.stat.neg b{color:var(--danger)}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 13px;border-radius:7px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.p{background:var(--brand);border-color:var(--brand);color:var(--btn-ink,#fff)}.btn.p:hover{background:var(--brand);filter:brightness(.9);color:var(--btn-ink,#fff)}
.btn.d{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 50%,var(--line));background:color-mix(in srgb,var(--danger) 9%,var(--panel));transition:background .15s,color .15s,transform .15s,box-shadow .15s}
.btn.d:hover:not(:disabled){background:var(--danger);border-color:var(--danger);color:var(--dng-ink);transform:scale(1.07);box-shadow:0 3px 10px color-mix(in srgb,var(--danger) 45%,transparent)}
.btn.d:active:not(:disabled){transform:scale(.97)}
.btn.d:disabled{background:var(--panel);border-color:var(--line);color:var(--muted)}
.btn.s{padding:3px 9px;font-size:calc(12px*var(--fz,1))}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hdr{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px 14px;margin-bottom:12px}
.hdr.w2{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f>label{font-size:calc(12px*var(--fz,1));color:var(--muted)}
.f.span2{grid-column:span 2}.f.full{grid-column:1/-1}
input,select,textarea{background:var(--field);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
input[readonly]{background:var(--head)}
input.num,td input.num{direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
input[type=checkbox]{width:auto}
.tblw{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%}
th,td{padding:5px 7px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
th{background:var(--head);font-size:calc(12px*var(--fz,1));font-weight:700;position:sticky;top:0;white-space:nowrap;z-index:1}
td.n,th.n{text-align:left;direction:ltr;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--brand-l)}
tfoot td{font-weight:700;background:var(--head)}
.lines th.n{text-align:right;direction:rtl}.lines td{padding:2px 3px}.lines td input{border-color:transparent;background:transparent;padding:5px 6px}
.lines td input:hover{border-color:var(--line)}.lines td input:focus{background:var(--field)}
.lines td.c{text-align:left;direction:ltr;padding:5px 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.lines td.c.hl{background:var(--warn)}
.foot{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:9px 14px;margin-top:12px;padding:12px;background:var(--head);border-radius:8px}
.nav{display:flex;align-items:center;gap:5px}
.nav input{width:78px;text-align:center}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:calc(12px*var(--fz,1));background:var(--brand-l);color:var(--brand)}
.pill.r{background:color-mix(in srgb,var(--danger) 16%,var(--panel));color:var(--danger)}
.muted{color:var(--muted)}.neg{color:var(--danger)}.pos{color:var(--ok)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 14px;cursor:pointer;border-bottom:3px solid transparent;color:var(--muted)}
.tabs button.on{color:var(--brand);border-color:var(--brand);font-weight:700}
.split{display:grid;grid-template-columns:300px 1fr;gap:12px;align-items:start}
.rlist{max-height:70vh;overflow:auto;padding:4px}
.rlist button{display:block;width:100%;text-align:right;background:none;border:0;padding:7px 10px;border-radius:6px;cursor:pointer}
.rlist button:hover{background:var(--head)}.rlist button.on{background:var(--brand);color:#fff}
.modalbg{position:fixed;inset:0;background:rgba(10,18,26,.5);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:50;overflow:auto}
.modal{background:var(--panel);border-radius:12px;width:min(560px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal.wide{width:min(1000px,100%)}
.modal>header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.modal>header b{font-size:calc(15px*var(--fz,1))}
.modal>.body{padding:14px 16px;max-height:76vh;overflow:auto}
.modal>footer{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:6px;justify-content:flex-start}
.x{border:0;background:none;font-size:calc(22px*var(--fz,1));cursor:pointer;color:var(--muted);line-height:1}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#33424d;color:#f1f4f6;padding:10px 18px;border-radius:8px;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:90vw}
.toast.err{background:var(--danger)}
.chart{display:flex;align-items:flex-end;gap:8px;height:190px;padding:10px 6px 0;border-bottom:1px solid var(--line)}
.chart div{flex:1;background:var(--brand);border-radius:4px 4px 0 0;position:relative;min-height:2px}
.chart div span{position:absolute;top:-17px;width:100%;text-align:center;font-size:calc(10px*var(--fz,1));color:var(--muted);white-space:nowrap}
.chartx{display:flex;gap:8px;padding:4px 6px;font-size:calc(11px*var(--fz,1));color:var(--muted)}.chartx span{flex:1;text-align:center}
.note{background:var(--warn);border-radius:8px;padding:8px 12px;font-size:calc(12.5px*var(--fz,1))}
#printArea{display:none}
.ph{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:8px}
.pt{width:100%;border-collapse:collapse;color:#000}.pt th,.pt td{border:1px solid #444;padding:3px 6px;font-size:calc(12px*var(--fz,1));background:#fff;position:static}
.pt th{background:#eee}
@media (max-width:860px){.split{grid-template-columns:1fr}}
@media print{body{background:#fff}.mbar,.side,#scrim,.app,.toast,.modalbg{display:none!important}#printArea{display:block!important;color:#000;direction:rtl;padding:6mm}@page{margin:8mm}}

.sum{background:var(--head);border-radius:8px;padding:6px 10px;margin-top:10px;display:flex;flex-direction:column;gap:2px}
.sumrow{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;padding:4px 0}
.sumrow+.sumrow{border-top:1px dashed var(--line)}
.sumrow .st{font-size:calc(12px*var(--fz,1));color:var(--brand);min-width:52px;padding-bottom:5px}
.sumrow .f{flex:1 1 105px;max-width:165px;gap:1px}
.sumrow .f>label{font-size:calc(11px*var(--fz,1))}
.sumrow .f input{padding:2px 7px;height:calc(27px*var(--fz,1));font-size:calc(13px*var(--fz,1))}
.sumrow .f.k input{font-weight:700;background:var(--field);border-color:var(--brand)}
.sumrow .vs{width:1px;align-self:stretch;background:var(--line);margin:2px 4px}

.lts{background:var(--gs-bg);border-color:var(--gs-line)}.lts th{background:var(--gs-head)}.lts td,.lts th{border-color:var(--gs-line)}.lts tbody tr:hover{background:var(--gs-hov)}
.ltb{background:var(--gb-bg);border-color:var(--gb-line)}.ltb th{background:var(--gb-head)}.ltb td,.ltb th{border-color:var(--gb-line)}.ltb tbody tr:hover{background:var(--gb-hov)}
.lt .lines td.c.hl{background:transparent;font-weight:700}

/* ألوان التقارير */
.rep[data-cat=cust]{--r0:#d6e2ea;--r1:#e8eff4;--rh:#c6d8e3;--rl:#b5c9d7;--rc:#3b6b8c;--rci:#ffffff}
.rep[data-cat=item]{--r0:#e6dcc2;--r1:#f1ebd9;--rh:#dacdab;--rl:#cbbf9d;--rc:#86652a;--rci:#ffffff}
.rep[data-cat=cash]{--r0:#d8e5d8;--r1:#e9f1e8;--rh:#c6d9c7;--rl:#b5cbb6;--rc:#46764f;--rci:#ffffff}
.rep[data-cat=profit]{--r0:#e4d9e3;--r1:#f0e9ef;--rh:#d6c8d5;--rl:#c6b6c5;--rc:#77557a;--rci:#ffffff}
@media (prefers-color-scheme:dark){
:root:not([data-theme=light]) .rep[data-cat=cust]{--r0:#1d2a34;--r1:#25343f;--rh:#2e414f;--rl:#3a4f60;--rc:#7fb3d6;--rci:#14202a}
:root:not([data-theme=light]) .rep[data-cat=item]{--r0:#2b2619;--r1:#353021;--rh:#443d29;--rl:#53492f;--rc:#d9b36a;--rci:#2a2112}
:root:not([data-theme=light]) .rep[data-cat=cash]{--r0:#1d2b22;--r1:#263529;--rh:#2f4435;--rl:#3c5543;--rc:#84c496;--rci:#14231a}
:root:not([data-theme=light]) .rep[data-cat=profit]{--r0:#2a2029;--r1:#342a33;--rh:#433543;--rl:#544354;--rc:#c79bc9;--rci:#261a27}
}
:root[data-theme=dark] .rep[data-cat=cust]{--r0:#1d2a34;--r1:#25343f;--rh:#2e414f;--rl:#3a4f60;--rc:#7fb3d6;--rci:#14202a}
:root[data-theme=dark] .rep[data-cat=item]{--r0:#2b2619;--r1:#353021;--rh:#443d29;--rl:#53492f;--rc:#d9b36a;--rci:#2a2112}
:root[data-theme=dark] .rep[data-cat=cash]{--r0:#1d2b22;--r1:#263529;--rh:#2f4435;--rl:#3c5543;--rc:#84c496;--rci:#14231a}
:root[data-theme=dark] .rep[data-cat=profit]{--r0:#2a2029;--r1:#342a33;--rh:#433543;--rl:#544354;--rc:#c79bc9;--rci:#261a27}
.rep .tabs button[data-c=cust]{--tc:#3b6b8c}
.rep .tabs button[data-c=item]{--tc:#86652a}
.rep .tabs button[data-c=cash]{--tc:#46764f}
.rep .tabs button[data-c=profit]{--tc:#77557a}
@media (prefers-color-scheme:dark){
:root:not([data-theme=light]) .rep .tabs button[data-c=cust]{--tc:#7fb3d6}
:root:not([data-theme=light]) .rep .tabs button[data-c=item]{--tc:#d9b36a}
:root:not([data-theme=light]) .rep .tabs button[data-c=cash]{--tc:#84c496}
:root:not([data-theme=light]) .rep .tabs button[data-c=profit]{--tc:#c79bc9}
}
:root[data-theme=dark] .rep .tabs button[data-c=cust]{--tc:#7fb3d6}
:root[data-theme=dark] .rep .tabs button[data-c=item]{--tc:#d9b36a}
:root[data-theme=dark] .rep .tabs button[data-c=cash]{--tc:#84c496}
:root[data-theme=dark] .rep .tabs button[data-c=profit]{--tc:#c79bc9}
.rep{background:var(--r0);border-radius:12px;padding:12px;transition:background .2s}
.rep .tabs{border-color:var(--rl);margin-bottom:10px}
.rep .tabs button{display:inline-flex;align-items:center;border-radius:8px 8px 0 0;padding:8px 16px}
.rep .tabs button::before{content:'';width:9px;height:9px;border-radius:50%;background:var(--tc);margin-inline-end:8px}
.rep .tabs button.on{color:var(--ink);border-color:var(--tc);background:var(--r1)}
.rep .card{background:var(--r1);border-color:var(--rl)}
.rep .rlist button:hover{background:var(--rh)}
.rep .rlist button.on{background:var(--rc);color:var(--rci)}
.rep .tblw{background:var(--r1);border-color:var(--rl)}
.rep th{background:var(--rh)}.rep td,.rep th{border-color:var(--rl)}
.rep tbody tr:hover{background:var(--rh)}.rep tfoot td{background:var(--rh)}
.rep .btn.p{background:var(--rc);border-color:var(--rc);color:var(--rci)}
.rep h3{color:var(--rc)}
.rep .note{background:var(--rh)}
.rep .chart div{background:var(--rc)}

:root{--gt-bg:#e7e5ee;--gt-head:#d4d0e3;--gt-line:#c6c1da;--gt-hov:#dddae9}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--gt-bg:#2a2833;--gt-head:#38354a;--gt-line:#433f58;--gt-hov:#322f40}}
:root[data-theme=dark]{--gt-bg:#2a2833;--gt-head:#38354a;--gt-line:#433f58;--gt-hov:#322f40}
:root[data-theme=warm]{--gt-bg:#e6dfd8;--gt-head:#d6ccc2;--gt-line:#c9bdb1;--gt-hov:#ddd4ca}
.ltt{background:var(--gt-bg);border-color:var(--gt-line)}.ltt th{background:var(--gt-head)}.ltt td,.ltt th{border-color:var(--gt-line)}.ltt tbody tr:hover{background:var(--gt-hov)}

a.btn{text-decoration:none;color:inherit;display:inline-block}a.btn:hover{color:var(--brand)}

/* ===== التاريخ المجسم ===== */
.side{display:flex;flex-direction:column}
#dwSide{margin-top:auto;padding:16px 2px 8px}
#dwSide .dw{width:100%}
#dwSide .dw{font-size:min(calc(var(--dw-s,1)*14px),17px)}

.dw-top{margin-inline-start:auto}
.dw{--c:var(--dw-c);--t:var(--dw-t);--d:color-mix(in srgb,var(--c) 68%,#000);--l:color-mix(in srgb,var(--c) 62%,#fff);font-size:calc(var(--dw-s,1)*14px);width:10em;text-align:center;position:relative;user-select:none;line-height:1.2}
.dw-sm{--dw-s:.8}.dw-md{--dw-s:1.05;margin-inline:auto}.dw-lg{--dw-s:1.35}.dw-xl{--dw-s:1.75}
.dw-in{display:flex;flex-direction:column;align-items:center;gap:.1em;padding:.75em .6em .85em;position:relative;z-index:1}
.dw-day{font-size:1em;font-weight:700;order:0}.dw-num{font-size:3.5em;font-weight:800;line-height:1.05;order:0}.dw-mon{font-size:.88em;order:0}.dw-time{font-size:.82em;order:1;margin-top:.15em;opacity:.95;font-variant-numeric:tabular-nums}
/* كارت مجسم */
.dw-card3d{border-radius:1.1em;color:var(--t);background:linear-gradient(160deg,var(--l),var(--c) 48%,var(--d));box-shadow:0 .25em 0 var(--d),0 .5em 0 color-mix(in srgb,var(--d) 65%,#000),0 1em 1.3em -.2em rgba(0,0,0,.45),inset 0 .12em .2em rgba(255,255,255,.5),inset 0 -.2em .3em rgba(0,0,0,.22);transform:perspective(42em) rotateX(5deg);margin-bottom:.55em}
.dw-card3d .dw-num{text-shadow:0 .035em 0 var(--d),0 .07em 0 color-mix(in srgb,var(--d) 70%,#000),0 .11em .12em rgba(0,0,0,.4)}
/* تقويم ورقي */
.dw-paper{background:#fffdf8;border-radius:.7em;color:#2b2b2b;box-shadow:0 .12em 0 #eae5d9,0 .24em 0 #d8d2c3,0 .36em 0 #c7c0ae,0 .85em 1.2em -.2em rgba(0,0,0,.4);margin-top:.5em;margin-bottom:.45em}
.dw-paper::before,.dw-paper::after{content:'';position:absolute;top:-.42em;width:.55em;height:.95em;border-radius:.3em;background:linear-gradient(90deg,#8e959a,#eceff0 50%,#868d92);box-shadow:0 .1em .15em rgba(0,0,0,.35);z-index:3}
.dw-paper::before{left:24%}.dw-paper::after{right:24%}
.dw-paper .dw-in{padding:0 0 .7em}
.dw-paper .dw-mon{order:-2;width:100%;background:linear-gradient(var(--l),var(--c));color:var(--t);border-radius:.7em .7em 0 0;padding:.8em .4em .5em;font-weight:700;box-shadow:inset 0 -.1em 0 rgba(0,0,0,.18)}
.dw-paper .dw-day{order:-1;margin-top:.5em;color:var(--d)}
.dw-paper .dw-num{color:var(--d);text-shadow:0 .045em 0 #fff,0 .09em .1em rgba(0,0,0,.25)}
.dw-paper .dw-time{color:#6c6c6c}
/* زجاجي */
.dw-glass{border-radius:1.1em;color:var(--ink);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 40%,transparent),color-mix(in srgb,var(--c) 10%,transparent));border:.07em solid color-mix(in srgb,#fff 55%,transparent);backdrop-filter:blur(.6em);box-shadow:0 .9em 1.5em -.4em color-mix(in srgb,var(--c) 55%,transparent),inset 0 .12em .2em rgba(255,255,255,.65),inset 0 -.15em .3em color-mix(in srgb,var(--c) 25%,transparent);margin-bottom:.4em}
.dw-glass::before{content:'';position:absolute;inset:.3em;border-radius:.85em;background:linear-gradient(160deg,rgba(255,255,255,.5),transparent 42%);pointer-events:none}
.dw-glass .dw-num{color:var(--d);text-shadow:0 .05em 0 rgba(255,255,255,.75),0 .12em .18em color-mix(in srgb,var(--c) 45%,transparent)}
/* شاشة رقمية */
.dw-digital{border-radius:.9em;background:linear-gradient(180deg,#0e1418,#182026);color:var(--l);border:.14em solid #2b363d;box-shadow:0 .1em 0 #3d4b54,0 .6em 1em -.2em rgba(0,0,0,.55),inset 0 .25em .6em rgba(0,0,0,.75),inset 0 -.08em .15em rgba(255,255,255,.08);font-family:Consolas,"Courier New",monospace;margin-bottom:.3em}
.dw-digital .dw-num{font-weight:700;color:var(--l);text-shadow:0 0 .22em var(--c),0 0 .6em var(--c)}
.dw-digital .dw-time{padding:.12em .7em;background:rgba(0,0,0,.5);border-radius:.4em;box-shadow:inset 0 .08em .2em rgba(0,0,0,.85);text-shadow:0 0 .3em var(--c)}
/* معدني */
.dw-metal{border-radius:1em;background:linear-gradient(145deg,#fbfcfc 0%,#ced4d8 35%,#f2f5f6 52%,#a6afb5 100%);color:#2e373d;border:.08em solid #8d979d;box-shadow:0 .12em 0 #7c868c,0 .3em 0 #5d666b,0 .85em 1.2em -.2em rgba(0,0,0,.5),inset 0 .1em .15em #fff,inset 0 -.15em .25em rgba(0,0,0,.25);margin-bottom:.4em}
.dw-metal .dw-num{color:var(--d);text-shadow:0 .04em 0 rgba(255,255,255,.95),0 -.03em 0 rgba(0,0,0,.3)}
.dw-metal .dw-day{color:var(--d);border-bottom:.1em solid var(--c);padding:0 .6em .1em}
@media print{.dw{display:none}}
.dw-top .dw{font-size:calc(var(--dw-s,1)*9px)}
.top:has(.dw-top){align-items:center}

/* ساعة كلاسيك */
.dw-analog{border-radius:1.1em;color:#f4e6cc;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c) 45%,color-mix(in srgb,var(--c) 60%,#000));box-shadow:0 .25em 0 color-mix(in srgb,var(--c) 55%,#000),0 .9em 1.3em -.2em rgba(0,0,0,.5),inset 0 .12em .2em rgba(255,255,255,.4);margin-bottom:.5em}
.dw-analog .dw-in{padding:.8em .5em .8em}
.dw-face{width:7em;height:7em;border-radius:50%;position:relative;background:radial-gradient(circle at 35% 30%,#fffdf6,#eadfc6 70%,#cdbf9f);border:.35em solid #c8a24a;box-shadow:0 0 0 .08em #6d5420,0 .3em .6em rgba(0,0,0,.45),inset 0 .2em .5em rgba(0,0,0,.3)}
.dw-face i{position:absolute;inset:0;display:block}.dw-face i::before{content:'';position:absolute;top:.2em;left:50%;width:.12em;height:.55em;margin-left:-.06em;background:#4a3a1c;border-radius:.1em}
.dw-face b{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;background:#2c2416;border-radius:.2em;box-shadow:.05em .1em .15em rgba(0,0,0,.4)}
.dw-face .hh{width:.3em;height:1.9em;margin-left:-.15em}.dw-face .mh{width:.2em;height:2.7em;margin-left:-.1em}
.dw-face .pin{position:absolute;left:50%;top:50%;width:.6em;height:.6em;margin:-.3em;border-radius:50%;background:radial-gradient(#e8c870,#8a6a20)}
.dw-win{position:absolute;right:.75em;top:50%;margin-top:-.7em;min-width:1.5em;height:1.4em;line-height:1.4em;background:#fff;color:#7a1f1f;font-weight:800;font-size:.9em;border:.08em solid #5a4a28;border-radius:.2em;box-shadow:inset 0 .1em .2em rgba(0,0,0,.35)}
.dw-analog .dw-day{margin-top:.4em}
/* كلاسيك ذهبي */
.dw-classic{border-radius:.9em;color:#3a2a0a;background:linear-gradient(145deg,#fff3c8,#f0d27a 40%,#fbe9a8 55%,#c89a2e);border:.18em double #7a5a14;box-shadow:0 .15em 0 #8a6a1c,0 .35em 0 #5e4510,0 .9em 1.2em -.2em rgba(0,0,0,.5),inset 0 .1em .2em #fff9de,inset 0 -.15em .3em rgba(110,80,10,.35);margin-bottom:.45em;font-family:Georgia,"Times New Roman",serif}
.dw-classic .dw-in{outline:.07em solid #8a6a1c;outline-offset:-.35em;border-radius:.6em}
.dw-classic .dw-num{color:#5a3d06;text-shadow:0 .04em 0 #fff6cf,0 .08em .1em rgba(60,40,0,.45)}
/* ساعة رقمية قلابة */
.dw-flip{color:#e9f3f9;background:linear-gradient(#1b2329,#10161a);border-radius:1em;box-shadow:0 .5em 0 #090d10,0 1em 1.3em -.2em rgba(0,0,0,.6),inset 0 .08em .15em rgba(255,255,255,.12);margin-bottom:.6em}
.dw-cards{display:flex;gap:.35em;direction:ltr}
.dw-cards span{position:relative;font-size:2.1em;font-weight:800;padding:.1em .22em;border-radius:.2em;color:#fff;background:linear-gradient(#34424b 49%,#0b1013 50%,#222d34);box-shadow:0 .08em .12em rgba(0,0,0,.6),inset 0 .04em 0 rgba(255,255,255,.2);text-shadow:0 .04em .08em #000;font-variant-numeric:tabular-nums}
.dw-flip .dw-day{background:var(--c);color:var(--t);padding:.1em .9em;border-radius:.5em;box-shadow:0 .12em 0 color-mix(in srgb,var(--c) 55%,#000)}
.dw-flip .dw-time{color:var(--l)}
/* LED */
.dw-led{color:var(--c);background:#0b0707;border-radius:.8em;border:.15em solid #3a2b2b;font-family:"Courier New",monospace;box-shadow:0 .1em 0 #54403f,0 .7em 1em -.2em rgba(0,0,0,.6),inset 0 0 .8em #000;margin-bottom:.35em}
.dw-led .dw-in>*{text-shadow:0 0 .3em var(--c),0 0 .8em var(--c)}
.dw-led .dw-num{font-weight:700;letter-spacing:.05em}
/* ===== الدخول والمستخدمون ===== */
body.locked .app{display:none}
.gate{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:var(--bg,#dfe5e4);padding:16px}
.gbox{width:min(380px,100%);background:var(--panel,#f0f2f1);border:1px solid var(--line,#c8d0cf);border-radius:16px;padding:26px 24px;box-shadow:0 1.2em 2.5em -1em rgba(0,0,0,.4),0 .25em 0 var(--line,#c8d0cf)}
.gbox h1{margin:0;font-size:calc(22px*var(--fz,1));text-align:center;color:var(--brand,#437470)}.gbox small{display:block;text-align:center;opacity:.7;margin-bottom:16px}
.gbox .f{margin-bottom:10px}.gbox .f input{width:100%}.gbox .btn{width:100%;margin-top:6px;padding:10px}
.gerr{color:#b3392f;text-align:center;min-height:20px;margin-top:8px;font-weight:600}
#userBox{margin-top:auto;padding-top:14px}#userBox+#dwSide{margin-top:0}
.ub{display:flex;gap:9px;align-items:center;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.1)}

/* ========== أدوات عامة ========== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

function docTotals(d,kind){
 let total=0,qty=0,cost=0,count=0;
 for(const l of d.lines){const q=num(l.qty),p=num(l.price);if(!q&&!l.code)continue;count++;qty+=q;total+=q*p;
  if(kind==='purchase'){}}
 const disc=d.discMode==='pct'?total*num(d.discPct)/100:num(d.discAmt);
 const net=total-disc;
 const paid=num(d.paidCash)+num(d.paidMaster);
 return{total,qty,count,disc,net,paid,rem:net-paid};
}
function purchaseLineCost(d,l){ // الكلفة بالدولار للوحدة شاملة المصاريف
 const rate=num(d.rate)||S().rate;
 const base=d.cur==='دولار'?num(l.price):num(l.price)/rate;
 const tot=docTotals(d).total;
 const expPct=tot>0?num(d.expenses)/tot*100:0;
 return base*(1+expPct/100);
}

function ledger(pid){
 const out=[];const add=(date,ts,doc,desc,iqd,usd)=>out.push({date,ts:ts||0,doc,desc,iqd,usd});
 const side=(cur,v)=>cur==='دولار'?[0,v]:[v,0];
 for(const s of live(DB.sales))if(s.personId==pid){const t=docTotals(s);add(s.date,s.ts,'بيع '+s.no,'قائمة مبيعات',...side(s.cur,t.net));if(t.paid)add(s.date,s.ts+.1,'بيع '+s.no,'مدفوع بالقائمة',...side(s.cur,-t.paid))}
 for(const p of live(DB.purchases))if(p.personId==pid){const t=docTotals(p);add(p.date,p.ts,'شراء '+p.no,'قائمة شراء',...side(p.cur,-t.net));if(t.paid)add(p.date,p.ts+.1,'شراء '+p.no,'مدفوع بالقائمة',...side(p.cur,t.paid))}
 for(const c of live(DB.cash))if((c.acct==='cust'||c.acct==='supp')&&c.personId==pid){const sg=c.type==='قبض'?-1:1;add(c.date,c.ts,(c.type==='قبض'?'قبض ':'صرف ')+c.no,c.type==='قبض'?'سند قبض':'سند صرف',sg*(num(c.iqdCash)+num(c.iqdMaster)+num(c.discIqd)),sg*(num(c.usd)+num(c.discUsd)))}
 out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.ts-b.ts);
 return out;
}
function balanceOf(pid,opt={}){ // موجب = عليه (مدين)، سالب = له

 for(const e of ledger(pid)){
  if(opt.before&&e.date>=opt.before)continue;
  if(opt.upTo&&e.date>opt.upTo)continue;

 return{iqd,usd};
}

function cashMoves(){

 for(const p of live(DB.purchases)){const t=docTotals(p);if(t.paid){const u=p.cur==='دولار';mv(p.date,p.ts,'شراء '+p.no,(person(p.personId)||{}).name||'','قائمة شراء',-1,u?0:num(p.paidCash),u?num(p.paidCash):0,u?0:num(p.paidMaster),{user:p.user})}}
 for(const c of live(DB.cash)){const who=c.acct==='exp'?c.expName:c.acct==='other'?c.expName:(person(c.personId)||{}).name||'';
  mv(c.date,c.ts,(c.type==='قبض'?'قبض ':'صرف ')+c.no,who,c.type==='قبض'?'سند قبض':'سند صرف',c.type==='قبض'?1:-1,num(c.iqdCash),num(c.usd),num(c.iqdMaster),{c,user:c.user})}

function saleProfit(s){

 const rate=num(s.rate)||S().rate;let rev=0,cost=0;
 const lines=s.lines.filter(l=>l.code).map(l=>{const rv=num(l.qty)*num(l.price)*k*r,cs=num(l.qty)*num(l.costUsd)*rate;rev+=rv;cost+=cs;return{l,rev:rv,cost:cs,profit:rv-cs}});

/* ========== دمج التعديلات بين الأجهزة (وضع الخادم الرسمي) ========== */
function mergeDB(base,mine,theirs){
 const eq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
 const out=JSON.parse(JSON.stringify(theirs));
 const renum={sales:[],purchases:[],transfers:[],cash:[]};
 const keyedMerge=(name,kf,isDoc)=>{
  const idx=a=>{const m=new Map();(a||[]).forEach(x=>m.set(String(x[kf]),x));return m};
  const B=idx(base[name]),M=idx(mine[name]),T=idx(theirs[name]);const res=new Map();
  for(const k of new Set([...B.keys(),...M.keys(),...T.keys()])){
   const b=B.get(k),m=M.get(k),t=T.get(k);const mc=!eq(m,b),tc=!eq(t,b);
   if(!mc){if(t!==undefined)res.set(k,t)}
   else if(!tc){if(m!==undefined)res.set(k,m)}
   else if(b===undefined&&m!==undefined&&t!==undefined){res.set(k,t);if(isDoc)renum[name].push(m)}
   else if(m===undefined){res.set(k,t)}
   else res.set(k,m)}
  out[name]=[...res.values()]};
 keyedMerge('persons','id');keyedMerge('items','code');keyedMerge('warehouses','id');keyedMerge('users','id');
 keyedMerge('sales','no',1);keyedMerge('purchases','no',1);keyedMerge('transfers','no',1);keyedMerge('cash','no',1);
 const kind={sales:'sale',purchases:'purchase',transfers:'transfer',cash:'cash'};
 out.seq=Object.assign({},theirs.seq);for(const k in mine.seq)out.seq[k]=Math.max(+mine.seq[k]||0,+out.seq[k]||0);
 for(const n in renum){for(const d of renum[n]){const mx=out[n].reduce((m,x)=>Math.max(m,+x.no||0),0);d.no=Math.max(mx,(+out.seq[kind[n]]||1)-1)+1;out.seq[kind[n]]=d.no+1;out[n].push(d)}}
 const setMerge=(b,m,t)=>{b=b||[];m=m||[];t=t||[];const res=[];for(const x of [...t,...m]){if(res.includes(x))continue;const iB=b.includes(x),iM=m.includes(x),iT=t.includes(x);if(iB&&!(iM&&iT))continue;res.push(x)}return res};
 out.groups=setMerge(base.groups,mine.groups,theirs.groups);out.expAccts=setMerge(base.expAccts,mine.expAccts,theirs.expAccts);
 const st=Object.assign({},theirs.settings);for(const k in mine.settings)if(!eq(mine.settings[k],(base.settings||{})[k]))st[k]=mine.settings[k];out.settings=st;
 const seen=new Set((base.log||[]).map(x=>JSON.stringify(x)));out.log=(theirs.log||[]).concat((mine.log||[]).filter(x=>!seen.has(JSON.stringify(x))&&!(theirs.log||[]).some(y=>eq(x,y))));
 out.waiting=mine.waiting||[];
 return out}

/* ========== قوائم المبيعات والشراء ========== */
function viewDoc(kind,openNo){
 const isS=kind==='sale';
 const LIST=()=>isS?DB.sales:DB.purchases;
 const title=isS?'قائمة المبيعات':'قائمة الشراء';
 const prefix=isS?'بيع ':'شراء ';
 let D,focusRow=0;
 const blank=()=>({code:'',name:'',carton:0,packing:1,qty:0,price:0,note:'',costUsd:0,wUsd:0,wIqd:0,rIqd:0});
 const newDoc=()=>({isNew:true,no:DB.seq[kind],date:today(),personId:isS?1:'',wh:S().defWh,cur:S().defCur,pay:S().defPay||'نقد',pricing:S().defPricing,ptype:'محلي',rate:S().rate,notes:'',lines:[blank()],discMode:'pct',discPct:0,discAmt:0,paidCash:0,paidMaster:0,paidManual:false,expenses:0,recvDate:today()});
 const load=no=>{const d=LIST().find(x=>x.no==no&&!x.deleted);if(!d)return false;D=JSON.parse(JSON.stringify(d));D.isNew=false;D.paidManual=true;if(!D.lines.length)D.lines=[blank()];return true};
 const ids=()=>LIST().filter(x=>!x.deleted).map(x=>x.no).sort((a,b)=>a-b);
 if(!(openNo&&load(openNo)))D=newDoc();
 const v=$('#view');

 function rowHTML(l,i){
  const inp=(f,cls='num',w='')=>`<input class="${cls}" data-f="${f}" value="${esc(l[f]===0&&f!=='price'?'':l[f]??'')}" ${w}inputmode="${cls==='num'?'decimal':'text'}">`;
  const code=`<td><input data-f="code" list="dl-code" value="${esc(l.code)}" style="width:84px"></td><td><input data-f="name" list="dl-name" value="${esc(l.name)}" style="min-width:210px"></td>`;
  const base=`<td>${inp('carton')}</td><td>${inp('packing')}</td><td>${inp('qty')}</td><td><select data-f="wh" class="lwh">${optList(DB.warehouses,l.wh||D.wh,w=>w.id,w=>w.name)}</select></td>`;
  if(isS)return `<tr data-i="${i}">${code}${base}<td>${inp('price')}</td><td class="c" data-c="total"></td><td><input data-f="note" value="${esc(l.note)}"></td><td><button class="btn s d" data-del="${i}" title="حذف السطر">×</button></td></tr>`;
  return `<tr data-i="${i}">${code}${base}<td>${inp('price')}</td><td class="c" data-c="total"></td><td class="c" data-c="cu"></td><td class="c hl" data-c="ct"></td><td>${inp('wUsd')}</td><td>${inp('wIqd')}</td><td>${inp('rIqd')}</td><td><button class="btn s d" data-del="${i}">×</button></td></tr>`;
 }
 const thead=isS?['رمز المادة','اسم المادة','كارتون','تعبئة','الكمية','المخزن','السعر','المبلغ','ملاحظات','']:['رمز المادة','اسم المادة','كارتون','تعبئة','الكمية','المخزن','السعر','المبلغ','كلفة الوحدة $','مبلغ الكلفة $','س.جملة $','س.جملة دينار','س.مفرد دينار',''];

 function render(){
  const p=person(D.personId);
  v.innerHTML=`
  <div class="top"><h2>${title}</h2></div>
  <div class="card">
   <div class="hdr">
    <div class="f"><label>رقم القائمة</label><input value="${D.no}" readonly class="num"></div>
    <div class="f"><label>التاريخ (${dayName(D.date)})</label><input type="date" data-d="date" value="${D.date}"></div>
    <div class="f"><label>نوع الدفع</label><select data-d="pay">${optList(['نقد','آجل'],D.pay)}</select></div>
    <div class="f"><label>العملة</label><select data-d="cur">${optList(['دينار','دولار'],D.cur)}</select></div>
    <div class="f"><label>سعر الصرف ($ إلى دينار)</label><input class="num" data-d="rate" value="${D.rate}"></div>
    <div class="f"><label>المخزن</label><select data-d="wh">${optList(DB.warehouses,D.wh,w=>w.id,w=>w.name)}</select></div>
    ${isS?`<div class="f"><label>التسعير</label><select data-d="pricing">${optList(['جملة','مفرد'],D.pricing)}</select></div>`:`<div class="f"><label>نوع الشراء</label><select data-d="ptype">${optList(['محلي','استيراد'],D.ptype)}</select></div><div class="f"><label>تاريخ الاستلام</label><input type="date" data-d="recvDate" value="${D.recvDate||D.date}"></div>`}
    <div class="f span2"><label>${isS?'الزبون':'المجهز'}</label><div class="bar" style="flex-wrap:nowrap"><input data-d="pname" list="${isS?'dl-cust':'dl-supp'}" value="${esc(p?p.name:'')}"><input class="num" data-d="personId" value="${D.personId}" style="width:70px" title="رقم الحساب"><button class="btn s" id="bAddP" title="إضافة جديد">+</button></div></div>
    <div class="f"><label>التلفون</label><input readonly value="${esc(p?p.phone:'')}" id="tel"></div>
    <div class="f full"><label>ملاحظات</label><input data-d="notes" value="${esc(D.notes)}"></div>
   </div>
   <div class="tblw lt ${isS?'lts':'ltb'}" style="max-height:46vh"><table class="lines${isS&&D.pricing==='مفرد'?' hide-cp':''}"><thead><tr>${thead.map((h,i)=>`<th${i>1&&h?' class="n"':''}>${h}</th>`).join('')}</tr></thead><tbody id="lb">${D.lines.map(rowHTML).join('')}</tbody></table></div>
   <div class="bar" style="margin-top:8px"><button class="btn s" id="bAddRow">+ سطر</button><span class="muted" id="info"></span></div>
   <div class="sum">
    <div class="sumrow"><b class="st">المجاميع</b>
     <div class="f"><label>عدد المواد</label><input class="num" id="fCount" readonly></div>
     <div class="f"><label>مجموع الكميات</label><input class="num" id="fQty" readonly></div>
     <div class="f"><label>المبلغ الكلي</label><input class="num" id="fTotal" readonly></div>
     <div class="f"><label>نسبة الخصم %</label><input class="num" data-d="discPct" value="${D.discPct||''}"></div>
     <div class="f"><label>الخصم</label><input class="num" data-d="discAmt" value="${D.discAmt||''}"></div>
     <div class="f k"><label>المبلغ بعد الخصم</label><input class="num" id="fNet" readonly></div>
    </div>
    <div class="sumrow"><b class="st">الدفع</b>
     <div class="f"><label>المدفوع كاش</label><input class="num" data-d="paidCash" value="${D.paidCash||''}"></div>
     <div class="f"><label>المدفوع ماستر</label><input class="num" data-d="paidMaster" value="${D.paidMaster||''}"></div>
     <div class="f k"><label>المتبقي</label><input class="num" id="fRem" readonly></div>
     <span class="vs"></span><b class="st">الرصيد</b>
     <div class="f"><label>السابق (دينار)</label><input class="num" id="pbI" readonly></div>
     <div class="f"><label>السابق ($)</label><input class="num" id="pbU" readonly></div>
     <div class="f k"><label>الحالي (دينار)</label><input class="num" id="cbI" readonly></div>
     <div class="f k"><label>الحالي ($)</label><input class="num" id="cbU" readonly></div>
    </div>
    ${isS?'':`<div class="sumrow"><b class="st">الكلفة</b>
     <div class="f"><label>مجموع المصاريف</label><input class="num" data-d="expenses" value="${D.expenses||''}"></div>
     <div class="f"><label>نسبة المصاريف %</label><input class="num" id="fExpP" readonly></div>
     <div class="f"><label>مجموع الكلفة $</label><input class="num" id="fCost" readonly></div></div>`}
   </div>
   <div class="bar" id="docBar" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">
    <button class="btn p" id="bSave">حفظ</button><button class="btn" id="bNew">جديد</button>
    <button class="btn d" id="bDel"${D.isNew?' disabled':''}>حذف</button>
    <button class="btn" id="bPrint">طباعة / PDF</button>${isS?'<button class="btn" id="bPrintNP">طباعة بدون سعر</button>':''}
    <button class="btn" id="bFind">بحث</button>
    <span class="nav"><button class="btn s" id="nFirst">⏮</button><button class="btn s" id="nPrev">▶</button><input id="nGo" class="num" value="${D.no}" title="اكتب الرقم واضغط Enter"><button class="btn s" id="nNext">◀</button><button class="btn s" id="nLast">⏭</button></span>
   </div>
   <div class="bar" style="margin-top:8px;gap:4px;font-size:12px">
    <button class="btn p s" id="bStmt">كشف حساب</button><button class="btn p s" id="bCash">${isS?'سند قبض':'سند صرف'}</button>
    <button class="btn p s" id="bMove">حركة مادة</button><button class="btn p s" id="bCard">بطاقة المادة</button><button class="btn p s" id="bStock">جرد المواد</button>
    ${isS?'<button class="btn p s" id="bHold">إضافة إلى الانتظار</button><button class="btn p s" id="bRest">استرجاع من الانتظار ('+DB.waiting.length+')</button>':''}
    <span class="muted" style="margin-inline-start:auto">${stampInfo(D)}</span>
   </div>
  </div>`;
  bind();recalc();
 }

 function setV(sel,val){const e=$(sel);if(e&&document.activeElement!==e)e.value=val}
 function recalc(){
  const rate=num(D.rate)||S().rate;
  const t=docTotals(D);
  if(D.discMode==='pct')D.discAmt=rnd(t.total*num(D.discPct)/100,2);else D.discPct=t.total?rnd(num(D.discAmt)/t.total*100,3):0;
  const t2=docTotals(D);
  if(D.pay==='نقد'&&!D.paidManual)D.paidCash=rnd(t2.net,2);
  const t3=docTotals(D);
  let costTot=0;
  $$('#lb tr').forEach((tr,i)=>{const l=D.lines[i];if(!l)return;const amt=num(l.qty)*num(l.price);
   const c=(k,val)=>{const e=$(`[data-c=${k}]`,tr);if(e)e.textContent=val};
   c('total',fmt(amt,2));
   if(!isS){const cu=purchaseLineCost(D,l);c('cu',fmt(cu,4));c('ct',fmt(cu*num(l.qty),3));costTot+=cu*num(l.qty)}});
  setV('#fCount',t3.count);setV('#fQty',fmt(t3.qty,3));setV('#fTotal',fmt(t3.total,2));setV('#fNet',fmt(t3.net,2));setV('#fRem',fmt(t3.rem,2));
  if(!isS){setV('#fCost',fmt(costTot,3));setV('#fExpP',t3.total?fmt(num(D.expenses)/t3.total*100,3):'0')}
  const dp=$('[data-d=discPct]'),da=$('[data-d=discAmt]');
  if(dp&&document.activeElement!==dp)dp.value=D.discPct||'';if(da&&document.activeElement!==da)da.value=D.discAmt||'';
  const pc=$('[data-d=paidCash]');if(pc&&document.activeElement!==pc)pc.value=D.paidCash||'';
  const pb=D.personId?balanceOf(D.personId,{exclude:D.isNew?null:prefix+D.no}):{iqd:0,usd:0};
  const sg=isS?1:-1,u=D.cur==='دولار';
  const ci=pb.iqd+(u?0:sg*t3.rem),cu2=pb.usd+(u?sg*t3.rem:0);
  setV('#pbI',fmt(pb.iqd,2));setV('#pbU',fmt(pb.usd,2));setV('#cbI',fmt(ci,2));setV('#cbU',fmt(cu2,2));
  updInfo();
 }
 function updInfo(){
  const l=D.lines[focusRow];const e=$('#info');if(!e)return;
  if(!l||!l.code){e.textContent='';return}
  const it=itemBy(l.code);const m=stockMap();
  e.textContent=`المتوفر في المخزن: ${fmt(stockOf(m,l.code,l.wh||D.wh),3)} — الإجمالي: ${fmt(stockOf(m,l.code),3)}${it&&it.cost?' — آخر كلفة: $'+fmt(it.cost,4):''}`;
  if(isS){let lp='';const arr=live(DB.sales).filter(s=>s.personId==D.personId&&s.no!=D.no).sort((a,b)=>a.date<b.date?1:-1);
   for(const s of arr){const x=s.lines.find(z=>z.code==l.code);if(x){lp=x.price;break}}if(lp!=='')e.textContent+=' — آخر سعر لهذا الزبون: '+fmt(lp,2)}
 }
 function pick(i,it){
  const l=D.lines[i];l.code=it.code;l.name=it.name;l.packing=it.packing||1;const rate=num(D.rate)||S().rate;
  if(isS){const w=D.pricing==='جملة';l.price=D.cur==='دولار'?(w?it.wUsd:(it.rIqd/rate)):(w?(it.wIqd||it.rIqd):(it.rIqd||it.wIqd));l.price=rnd(l.price||0,4);l.costUsd=it.cost||0}
  else{l.price=D.cur==='دولار'?(it.cost||0):rnd((it.cost||0)*rate,0);l.wUsd=it.wUsd||0;l.wIqd=it.wIqd||0;l.rIqd=it.rIqd||0}
  if(num(l.carton)>0&&!(isS&&D.pricing==='مفرد'))l.qty=num(l.carton)*num(l.packing);
  if(i===D.lines.length-1)D.lines.push(blank());
  focusRow=i;
  setTimeout(()=>{const lbx=$('#lb');if(!lbx)return;lbx.innerHTML=D.lines.map(rowHTML).join('');recalc();const q=$(`#lb tr[data-i="${i}"] [data-f=qty]`);if(q){q.focus();q.select()}},0);
 }
 function bind(){
  const lb=$('#lb');
  lb.addEventListener('input',e=>{const f=e.target.dataset.f;if(!f)return;const i=+e.target.closest('tr').dataset.i;const l=D.lines[i];focusRow=i;
   if(f==='code'||f==='name'||f==='note'){l[f]=e.target.value;return}
   if(f==='wh'){l.wh=+e.target.value;updInfo();return}
   l[f]=num(e.target.value);
   if(f==='carton'||f==='packing'){if(num(l.carton)>0){l.qty=num(l.carton)*(num(l.packing)||1);const q=$('[data-f=qty]',e.target.closest('tr'));q.value=l.qty}}
   if(f==='wUsd'&&!l.wIqdManual){l.wIqd=rndTo(num(l.wUsd)*(num(D.rate)||S().rate),S().roundTo);$('[data-f=wIqd]',e.target.closest('tr')).value=l.wIqd}
   if(f==='wIqd')l.wIqdManual=true;
   recalc();
  });
  lb.addEventListener('change',e=>{const f=e.target.dataset.f;if(f!=='code'&&f!=='name')return;const i=+e.target.closest('tr').dataset.i;const val=e.target.value.trim();if(!val)return;
   const it=f==='code'?itemBy(val):itemByName(val);if(it)pick(i,it);else{toast('المادة غير موجودة. أضفها من شاشة المواد.',1);e.target.value=D.lines[i][f]=''}});
  lb.addEventListener('focusin',e=>{const tr=e.target.closest('tr');if(tr){focusRow=+tr.dataset.i;updInfo()}});
  lb.addEventListener('keydown',e=>{if(e.key!=='Enter')return;e.preventDefault();const ins=$$('input',e.target.closest('tr'));const k=ins.indexOf(e.target);
   if(k<ins.length-1)ins[k+1].focus();else{const i=+e.target.closest('tr').dataset.i;if(i===D.lines.length-1&&D.lines[i].code){D.lines.push(blank());lb.insertAdjacentHTML('beforeend',rowHTML(D.lines[i+1],i+1))}const nx=$(`#lb tr[data-i="${i+1}"] input`);if(nx)nx.focus()}});
  lb.addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(!b)return;const i=+b.dataset.del;D.lines.splice(i,1);if(!D.lines.length)D.lines.push(blank());$('#lb').innerHTML=D.lines.map(rowHTML).join('');recalc()});
  $('#bAddRow').onclick=()=>{D.lines.push(blank());lb.insertAdjacentHTML('beforeend',rowHTML(D.lines[D.lines.length-1],D.lines.length-1))};
  v.oninput=e=>{const f=e.target.dataset.d;if(!f||f==='pname')return;
   if(['rate','expenses','discPct','discAmt','paidCash','paidMaster'].includes(f)||f==='personId'&&false)D[f]=num(e.target.value);else if(f!=='personId')D[f]=e.target.value;
   if(f==='discPct')D.discMode='pct';if(f==='discAmt')D.discMode='amt';
   if(f==='paidCash'||f==='paidMaster')D.paidManual=true;
   if(f==='wh'){D.wh=+e.target.value;const lbx=$('#lb');if(lbx)lbx.innerHTML=D.lines.map(rowHTML).join('')}
   if(f==='date'){const lab=e.target.closest('.f').firstElementChild;lab.textContent='التاريخ ('+dayName(D.date)+')'}
   if(f==='personId'){const p=person(e.target.value);if(p){D.personId=p.id;$('[data-d=pname]').value=p.name;$('#tel').value=p.phone||''}else D.personId=''}
   recalc();
  };
  v.onchange=e=>{const f=e.target.dataset.d;if(f==='pname'){const arr=DB.persons.filter(p=>isS?p.type!=='supplier':p.type!=='customer');const p=arr.find(x=>x.name===e.target.value.trim());
    if(p){D.personId=p.id;$('[data-d=personId]').value=p.id;$('#tel').value=p.phone||'';recalc()}else{toast('الاسم غير موجود. استخدم زر + للإضافة.',1);e.target.value=(person(D.personId)||{}).name||''}}
   if(f==='pricing'&&isS){const tb=$('table.lines');if(tb)tb.classList.toggle('hide-cp',D.pricing==='مفرد')}
   if(f==='cur'||f==='pricing'||f==='pay'){if(f==='pay')D.paidManual=false;recalc()}};
  $('#bAddP').onclick=()=>personModal(null,p=>{D.personId=p.id;render()},isS?'customer':'supplier');
  $('#bSave').onclick=saveDoc;
  $('#bNew').onclick=()=>{D=newDoc();render()};
  $('#bDel').onclick=()=>!can('del')?toast('لا تملك صلاحية الحذف',1):confirmBox('حذف هذه القائمة؟ تبقى محفوظة في تقرير القوائم المحذوفة.',()=>{const d=LIST().find(x=>x.no==D.no);if(d){d.deleted=true;d.delAt=today()+' '+nowT();d.delBy=curName();logAct('حذف',(isS?'قائمة مبيعات ':'قائمة مشتريات ')+d.no);save()}toast('تم الحذف');D=newDoc();render()});
  const go=no=>{if(load(no))render();else toast('رقم غير موجود',1)};
  $('#nGo').addEventListener('keydown',e=>{if(e.key==='Enter')go(num(e.target.value))});
  const a=ids();const k=a.indexOf(D.no);
  $('#nFirst').onclick=()=>a.length&&go(a[0]);$('#nLast').onclick=()=>a.length&&go(a[a.length-1]);
  $('#nPrev').onclick=()=>{if(D.isNew)return a.length&&go(a[a.length-1]);if(k>0)go(a[k-1])};
  $('#nNext').onclick=()=>{if(k>=0&&k<a.length-1)go(a[k+1]);else if(k===a.length-1){D=newDoc();render()}};
  $('#bPrint').onclick=()=>printDoc(false);if(isS)$('#bPrintNP').onclick=()=>printDoc(true);
  $('#bFind').onclick=findDoc;
  $('#bStmt').onclick=()=>D.personId?showStatement(D.personId):toast('اختر الحساب أولاً',1);
  $('#bCash').onclick=()=>{if(!D.personId)return toast('اختر الحساب أولاً',1);window._cashPre={type:isS?'قبض':'صرف',acct:isS?'cust':'supp',personId:D.personId};location.hash='#cash'};
  $('#bMove').onclick=()=>{const l=D.lines[focusRow];l&&l.code?showItemMove(l.code):toast('اختر سطراً فيه مادة',1)};
  $('#bCard').onclick=()=>{const l=D.lines[focusRow];l&&l.code?showItemCard(l.code):toast('اختر سطراً فيه مادة',1)};
  $('#bStock').onclick=showStockList;
  if(isS){$('#bHold').onclick=()=>{if(!D.lines.some(l=>l.code))return toast('القائمة فارغة',1);DB.waiting.push(JSON.parse(JSON.stringify(D)));save();D=newDoc();render();toast('أُضيفت إلى الانتظار')};
   $('#bRest').onclick=()=>{if(!DB.waiting.length)return toast('لا توجد قوائم بالانتظار');
    modal('قوائم الانتظار','<div class="tblw"><table><thead><tr><th>#</th><th>الزبون</th><th class="n">المواد</th><th class="n">المجموع</th><th></th></tr></thead><tbody></tbody></table></div>',{wide:false,onMount:(bg,close)=>{
     const tb=$('tbody',bg);tb.innerHTML=DB.waiting.map((w,i)=>`<tr><td>${i+1}</td><td>${esc((person(w.personId)||{}).name||'')}</td><td class="n">${w.lines.filter(l=>l.code).length}</td><td class="n">${fmt(docTotals(w).net,2)}</td><td><button class="btn s" data-w="${i}">استرجاع</button> <button class="btn s d" data-x="${i}">حذف</button></td></tr>`).join('');

 function validate(){
  D.lines=D.lines.filter(l=>l.code||l.name||num(l.qty));
  if(!D.lines.length){toast('أضف مادة واحدة على الأقل',1);return false}

  for(const l of D.lines){if(!itemBy(l.code)){toast('مادة غير معروفة: '+(l.name||l.code),1);return false}if(!(num(l.qty)>0)){toast('الكمية مطلوبة للمادة: '+l.name,1);return false}}
  if(!(num(D.rate)>0)){toast('سعر الصرف مطلوب',1);return false}

 }
 function saveDoc(){
  if(!validate()){if(!D.lines.length)D.lines=[blank()];return}
  const doSave=()=>{
   const rate=num(D.rate);
   D.lines.forEach(l=>{const it=itemBy(l.code);if(isS)l.costUsd=it.cost||0});
   if(!isS){D.lines.forEach(l=>{const it=itemBy(l.code);it.cost=rnd(purchaseLineCost(D,l),6);if(num(l.wUsd))it.wUsd=num(l.wUsd);if(num(l.wIqd))it.wIqd=num(l.wIqd);if(num(l.rIqd))it.rIqd=num(l.rIqd);if(num(l.packing)>1)it.packing=num(l.packing)})}
   const doc=JSON.parse(JSON.stringify(D));stampDoc(doc,D.isNew);doc.rate=rate;
   ['carton','packing','qty','price'].forEach(k=>doc.lines.forEach(l=>l[k]=num(l[k])));if(isS&&doc.pricing==='مفرد')doc.lines.forEach(l=>{l.carton=0});
   if(D.isNew){doc.ts=DB.seq.ts++;doc.no=DB.seq[kind];DB.seq[kind]++;LIST().push(doc)}
   else{const i=LIST().findIndex(x=>x.no==D.no);doc.ts=LIST()[i].ts;LIST()[i]=doc}
   logAct(D.isNew?'إنشاء':'تعديل',(isS?'قائمة مبيعات ':'قائمة مشتريات ')+doc.no,fmt(docTotals(doc).net,2)+' '+(doc.cur||'')+' — '+((person(doc.personId)||{}).name||''));delete doc.isNew;save();toast('تم الحفظ — رقم '+doc.no);D=newDoc();refreshLists();render();
  };
  // تحقق من المخزون (للبيع)
  if(isS){const m=stockMap();const q={};const K=(c,w)=>c+'|'+w;
   D.lines.forEach(l=>{if(l.code){const k=K(l.code,l.wh||D.wh);q[k]=(q[k]||0)+num(l.qty)}});
   if(!D.isNew){const old=DB.sales.find(x=>x.no==D.no);if(old)old.lines.forEach(l=>{if(l.code){const k=K(l.code,l.wh||old.wh);if(q[k]!==undefined)q[k]-=num(l.qty)}})}
   const bad=Object.keys(q).filter(k=>{const [c,w]=k.split('|');return stockOf(m,c,+w)-q[k]<-1e-9});
   if(bad.length)return confirmBox('الكمية المطلوبة أكثر من المتوفر للمواد: '+[...new Set(bad.map(k=>(itemBy(k.split('|')[0])||{}).name))].join('، ')+' — هل تريد الحفظ؟',doSave)}
  doSave();
 }
 function findDoc(){

 function printDoc(noPrice){

   +`<div class="pcust2"><span><small>${isS?'حضرة السيد:':'المجهز:'}</small>${esc(p.name||'—')}</span><span class="pty">${isS?'نوع البيع':'نوع الشراء'}: <b class="${D.pay==='آجل'?'cr':''}">${D.pay}</b></span></div>`
   +`<table class="pt pt2"><thead><tr><th>ت</th><th>المادة</th>${hideC?'':'<th>كارتون</th>'}<th>العدد</th><th>المخزن</th>${noPrice?'':`<th>السعر (${cu})</th><th>المجموع (${cu})</th>`}</tr></thead><tbody>${rows}</tbody></table>`

 function calc(){

   const pb=balanceOf(C.personId,{exclude:C.isNew?null:(C.type==='قبض'?'قبض ':'صرف ')+C.no});const sg=C.type==='قبض'?-1:1;
   sv('#pbI',fmt(pb.iqd,2));sv('#pbU',fmt(pb.usd,2));sv('#rbI',fmt(pb.iqd+sg*(iqd+num(C.discIqd)),2));sv('#rbU',fmt(pb.usd+sg*(usd+num(C.discUsd)),2))}

function movement(code,f,t,wh){
 const m=[];const it=itemBy(code);
 let open=0;if(it){for(const w in(it.open||{}))if(!wh||w==wh)open+=num(it.open[w])}
 const push=(date,ts,doc,who,inq,out)=>m.push({date,ts,doc,who,in:inq,out});
 for(const p of live(DB.purchases))for(const l of p.lines)if(l.code==code&&(!wh||(l.wh||p.wh)==wh))push(p.date,p.ts,'شراء '+p.no,pName(p.personId),num(l.qty),0);
 for(const s of live(DB.sales))for(const l of s.lines)if(l.code==code&&(!wh||(l.wh||s.wh)==wh))push(s.date,s.ts,'بيع '+s.no,pName(s.personId),0,num(l.qty));
 if(wh)for(const x of live(DB.transfers))for(const l of x.lines)if(l.code==code){if(x.to==wh)push(x.date,x.ts,'نقل '+x.no,'من '+whName(x.from),num(l.qty),0);if(x.from==wh)push(x.date,x.ts,'نقل '+x.no,'إلى '+whName(x.to),0,num(l.qty))}
 m.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.ts-b.ts);
 let bal=open;m.forEach(x=>{if(f&&x.date<f)bal+=x.in-x.out});
 const rows=[['','رصيد أول المدة','',0,0,bal]];let ti=0,to=0;
 for(const x of m)if(inRange(x.date,f,t)){bal+=x.in-x.out;ti+=x.in;to+=x.out;rows.push([dmy(x.date),x.doc,x.who,x.in,x.out,bal])}
 const cols=['التاريخ','المستند','الطرف','وارد','صادر','الرصيد'];
 return{cols,colsFix:cols,rows,foot:['','إجمالي الفترة','',ti,to,bal]};
}
function statement(pid,f,t){
 const p=person(pid)||{};let iqd=num(p.openIqd),usd=num(p.openUsd);const L=ledger(pid);
 for(const e of L)if(f&&e.date<f){iqd+=e.iqd;usd+=e.usd}
 const rows=[['','رصيد أول المدة','',0,0,0,0,iqd,usd]];let di=0,ci=0,du=0,cu=0;
 for(const e of L)if(inRange(e.date,f,t)){iqd+=e.iqd;usd+=e.usd;if(e.iqd>0)di+=e.iqd;else ci-=e.iqd;if(e.usd>0)du+=e.usd;else cu-=e.usd;
  rows.push([dmy(e.date),e.doc,e.desc,e.iqd>0?e.iqd:0,e.iqd<0?-e.iqd:0,e.usd>0?e.usd:0,e.usd<0?-e.usd:0,iqd,usd])}
 return{cols:['التاريخ','المستند','البيان','مدين دينار','دائن دينار','مدين $','دائن $','الرصيد دينار','الرصيد $'],rows,foot:['','الإجمالي','',di,ci,du,cu,iqd,usd],note:'الاسم: '+(p.name||'')+' — الرصيد الموجب = عليه، السالب = له'};
}

function monthly(year,isSale){
 const M=['كانون2','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين1','تشرين2','كانون1'];const arr=Array(12).fill(0);
 for(const d of live(isSale?DB.sales:DB.purchases)){if(+d.date.slice(0,4)!==+year)continue;arr[+d.date.slice(5,7)-1]+=toIqd(d,docTotals(d).net)}
 return{cols:['الشهر','المبلغ (دينار)'],rows:M.map((m,i)=>[m,arr[i]]),foot:['الإجمالي',arr.reduce((a,b)=>a+b,0)],chart:{labels:M,vals:arr}};

 }
 function showParams(keep){

   if(d.t==='date')inner=`<input type="date" data-p="${k}" value="${(window._repP||{})[k]??(d.d?d.d():'')}">`;

  $('#go').onclick=()=>{try{res=runReport(cur.id,params());$('#out').innerHTML=reportHTML(res);$('#pr').disabled=$('#ex').disabled=false}catch(e){toast(typeof e==='string'?e:'خطأ: '+e.message,1)}};

function toHex(str){try{const c=document.createElement('canvas');c.width=c.height=1;const x=c.getContext('2d',{willReadFrequently:true});x.clearRect(0,0,1,1);x.fillStyle='#000';x.fillStyle=String(str).trim();x.fillRect(0,0,1,1);const d=x.getImageData(0,0,1,1).data;return '#'+[d[0],d[1],d[2]].map(v=>v.toString(16).padStart(2,'0')).join('')}catch(e){return '#888888'}}
function lumOf(h){h=toHex(h).replace('#','');const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(parseInt(h.slice(0,2),16))+.7152*f(parseInt(h.slice(2,4),16))+.0722*f(parseInt(h.slice(4,6),16))}

 if(C.side)root.push(`--brand-d:${C.side}`,`--side-ink:${inkFor(C.side)==='#ffffff'?'#eef4f3':'#1d262d'}`);
 if(C.brand)root.push(`--brand:${C.brand}`,`--btn-ink:${inkFor(C.brand)}`);
 if(C.ink)root.push(`--ink:${C.ink}`);

/* ========== المستخدمون وكلمات المرور وسجل الحركات ========== */
function sha256(s){
 const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
 const b=[...new TextEncoder().encode(s)];const l=b.length*8;b.push(0x80);while(b.length%64!==56)b.push(0);
 for(let i=7;i>=0;i--)b.push(i>3?0:(l>>>(i*8))&255);
 let h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];const r=(x,n)=>(x>>>n)|(x<<(32-n));
 for(let o=0;o<b.length;o+=64){const w=[];for(let i=0;i<16;i++)w[i]=(b[o+i*4]<<24)|(b[o+i*4+1]<<16)|(b[o+i*4+2]<<8)|b[o+i*4+3];
  for(let i=16;i<64;i++){const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3),s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
  let[a,c,d,e,f,g,hh,j]=h;
  for(let i=0;i<64;i++){const S1=r(f,6)^r(f,11)^r(f,25),ch=(f&g)^(~f&hh),t1=(j+S1+ch+K[i]+w[i])|0,S0=r(a,2)^r(a,13)^r(a,22),mj=(a&c)^(a&d)^(c&d),t2=(S0+mj)|0;j=hh;hh=g;g=f;f=(e+t1)|0;e=d;d=c;c=a;a=(t1+t2)|0}
  h=[(h[0]+a)|0,(h[1]+c)|0,(h[2]+d)|0,(h[3]+e)|0,(h[4]+f)|0,(h[5]+g)|0,(h[6]+hh)|0,(h[7]+j)|0]}
 return h.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}
function hashPw(pw,salt){let x=salt+'|'+pw;for(let i=0;i<2000;i++)x=sha256(x+salt);return x}
const newSalt=()=>[...crypto.getRandomValues(new Uint8Array(12))].map(b=>b.toString(16).padStart(2,'0')).join('');
let CU=null;
const curName=()=>CU?CU.name:'—';
const isAdmin=()=>!!CU&&CU.role==='admin';

function restoreSession(){try{const id=+sessionStorage.getItem('acc_cu')||+window.FV_UID||0;const u=DB.users.find(x=>x.id===id&&x.active);if(u){CU=u;return true}}catch(e){}return false}
function gateHTML(inner){return `<div class="gate"><div class="gbox"><h1>التحدي</h1><small>نظام حسابات ومخزون</small>${inner}</div></div>`}
let failN=0;
function showGate(){
 const bg=document.getElementById('gate')||document.body.appendChild(Object.assign(document.createElement('div'),{id:'gate'}));
 document.body.classList.add('locked');
 const first=!DB.users.length;
 bg.innerHTML=gateHTML(first?`<p class="muted">أول تشغيل: أنشئ حساب المدير. بعدها كل مستخدم يدخل باسمه وكلمة مروره.</p>
  <div class="f"><label>اسم المدير (يظهر بالقوائم)</label><input id="g_name" autocomplete="off"></div>
  <div class="f"><label>اسم الدخول</label><input id="g_user" autocomplete="off" dir="ltr"></div>
  <div class="f"><label>كلمة المرور</label><input id="g_pw" type="password" dir="ltr"></div>
  <div class="f"><label>تأكيد كلمة المرور</label><input id="g_pw2" type="password" dir="ltr"></div>
  <button class="btn p" id="g_go">إنشاء والدخول</button><button class="btn" id="g_link">ربط هذا الجهاز بحساب سحابي موجود</button><div class="gerr" id="g_err"></div>`
 :`<div class="f"><label>اسم الدخول</label><input id="g_user" autocomplete="off" dir="ltr"></div>
  <div class="f"><label>كلمة المرور</label><input id="g_pw" type="password" dir="ltr"></div>
  <button class="btn p" id="g_go">دخول</button><div class="gerr" id="g_err"></div>`);
 const err=m=>{$('#g_err').textContent=m};
 const go=()=>{
  const un=$('#g_user').value.trim(),pw=$('#g_pw').value;
  if(first){const nm=$('#g_name').value.trim();if(!nm||!un||!pw)return err('أكمل كل الحقول');if(pw.length<4)return err('كلمة المرور 4 أحرف على الأقل');if(pw!==$('#g_pw2').value)return err('كلمتا المرور غير متطابقتين');
   const u=makeUser(nm,un,pw,'admin');DB.users.push(u);setSession(u);logAct('إنشاء','حساب المدير '+nm);logAct('دخول','تسجيل دخول');save();return enter()}
  const u=DB.users.find(x=>x.user.toLowerCase()===un.toLowerCase());
  if(!u||!u.active||hashPw(pw,u.salt)!==u.hash){failN++;err(failN>=5?'محاولات كثيرة، انتظر قليلاً ثم أعد المحاولة':'اسم الدخول أو كلمة المرور غير صحيحة');if(failN>=5){$('#g_go').disabled=true;setTimeout(()=>{failN=0;const b=$('#g_go');if(b)b.disabled=false},15000)}
   if(u){logAct('محاولة دخول فاشلة','كلمة مرور خاطئة');DB.log[DB.log.length-1].u=u.name;save()}return}
  failN=0;setSession(u);logAct('دخول','تسجيل دخول');save();enter()};
 $('#g_go').onclick=go;
 const lk=$('#g_link');if(lk)lk.onclick=()=>{bg.innerHTML=gateHTML(`<p class="muted">الصق «رمز الربط» المنسوخ من الحاسوب (الإعدادات ← المزامنة السحابية).</p><div class="f"><textarea id="g_code" dir="ltr" rows="4" style="width:100%"></textarea></div><button class="btn p" id="g_ok">ربط</button><button class="btn" id="g_back">رجوع</button><div class="gerr" id="g_err"></div>`);$('#g_back').onclick=showGate;$('#g_ok').onclick=async()=>{$('#g_err').textContent='جارٍ الربط...';const m=await syLinkFromGate($('#g_code').value);if(m){$('#g_err').textContent=m;return}showGate()}};bg.onkeydown=e=>{if(e.key==='Enter')go()};
 setTimeout(()=>($(first?'#g_name':'#g_user')||{focus(){}}).focus(),50);
}
function enter(){const g=document.getElementById('gate');if(g)g.remove();document.body.classList.remove('locked');S().user=curName();applyTheme();mountUserBox();location.hash=location.hash||'#home';route()}
function logout(){logAct('خروج','تسجيل خروج');save();if(window.FV_SERVER){setTimeout(()=>{fetch('/api/logout',{method:'POST'}).finally(()=>{try{sessionStorage.removeItem('acc_cu')}catch(e){}location.reload()})},900);return}setSession(null);const v=$('#view');v.replaceWith(v.cloneNode(false));$('#view').innerHTML='';showGate()}
function mountUserBox(){const b=$('#userBox');if(!b)return;if(!CU){b.innerHTML='';return}
 b.innerHTML=`<div class="ub"><span class="ua">${esc(CU.name.slice(0,1))}</span><div><b>${esc(CU.name)}</b><small>${CU.role==='admin'?'مدير':'مستخدم'}</small></div></div><div class="ubb"><button id="ubPw">كلمة المرور</button><button id="ubOut">خروج</button></div>`;
 $('#ubOut').onclick=logout;$('#ubPw').onclick=()=>changePwModal(CU)}
function changePwModal(u,admin){
 modal('تغيير كلمة المرور — '+u.name,`<div class="hdr w2">${admin?'':'<div class="f full"><label>كلمة المرور الحالية</label><input type="password" id="p0" dir="ltr"></div>'}<div class="f"><label>كلمة المرور الجديدة</label><input type="password" id="p1" dir="ltr"></div><div class="f"><label>تأكيد</label><input type="password" id="p2" dir="ltr"></div></div>`,
 {buttons:[{label:'حفظ',cls:'p',fn:bg=>{if(!admin&&hashPw($('#p0',bg).value,u.salt)!==u.hash){toast('كلمة المرور الحالية خاطئة',1);return false}
  const a=$('#p1',bg).value;if(a.length<4){toast('4 أحرف على الأقل',1);return false}if(a!==$('#p2',bg).value){toast('غير متطابقتين',1);return false}
  u.salt=newSalt();u.hash=hashPw(a,u.salt);logAct('تغيير كلمة مرور',u.name);save();toast('تم تغيير كلمة المرور')}},{label:'إلغاء'}]})}

 const rows=DB.users.map(u=>`<tr><td>${esc(u.name)}</td><td dir="ltr" style="text-align:right">${esc(u.user)}</td><td>${u.role==='admin'?'مدير':'مستخدم'}</td><td>${u.role==='admin'?'—':(u.canDel!==false?'نعم':'لا')}</td><td>${u.active?'فعّال':'موقوف'}</td><td><button class="btn s" data-e="${u.id}">تعديل</button> <button class="btn s" data-p="${u.id}">كلمة مرور</button> ${u.id===CU.id?'':`<button class="btn s d" data-x="${u.id}">حذف</button>`}</td></tr>`).join('');
 tb.innerHTML=`<div class="bar" style="margin-bottom:10px"><button class="btn p" id="uAdd">+ مستخدم جديد</button></div><div class="tblw"><table><thead><tr><th>الاسم</th><th>اسم الدخول</th><th>الصلاحية</th><th>الحذف</th><th>الحالة</th><th></th></tr></thead><tbody>${rows}</tbody></table></div><p class="muted">المدير يرى كل شيء ويدير المستخدمين والإعدادات. المستخدم العادي يعمل بالقوائم والسندات والتقارير، ويمكنك منعه من الحذف. كل حركة تُسجّل باسم صاحبها.</p>`;
 const edit=u=>{const isN=!u;const o=u||{name:'',user:'',role:'user',active:true,canDel:true};
  modal(isN?'مستخدم جديد':'تعديل مستخدم',`<div class="hdr w2"><div class="f"><label>الاسم (يظهر بالقوائم)</label><input id="u_n" value="${esc(o.name)}"></div><div class="f"><label>اسم الدخول</label><input id="u_u" dir="ltr" value="${esc(o.user)}"></div>${isN?'<div class="f"><label>كلمة المرور</label><input id="u_p" type="password" dir="ltr"></div>':''}<div class="f"><label>الصلاحية</label><select id="u_r"><option value="user"${o.role==='user'?' selected':''}>مستخدم</option><option value="admin"${o.role==='admin'?' selected':''}>مدير</option></select></div><div class="f"><label>&nbsp;</label><label style="color:var(--ink)"><input type="checkbox" id="u_d" ${o.canDel!==false?'checked':''}> يسمح بالحذف</label></div><div class="f"><label>&nbsp;</label><label style="color:var(--ink)"><input type="checkbox" id="u_a" ${o.active?'checked':''}> الحساب فعّال</label></div></div>`,
  {buttons:[{label:'حفظ',cls:'p',fn:bg=>{const n=$('#u_n',bg).value.trim(),un=$('#u_u',bg).value.trim();if(!n||!un){toast('الاسم واسم الدخول مطلوبان',1);return false}
   if(DB.users.some(x=>x!==u&&(x.user.toLowerCase()===un.toLowerCase()||x.name===n))){toast('الاسم أو اسم الدخول مستخدم مسبقاً',1);return false}
   const role=$('#u_r',bg).value,act=$('#u_a',bg).checked;
   if(u&&u.id===CU.id&&(role!=='admin'||!act)){toast('لا يمكنك إلغاء صلاحية حسابك أو إيقافه',1);return false}
   if(u&&u.role==='admin'&&(role!=='admin'||!act)&&DB.users.filter(x=>x.role==='admin'&&x.active&&x!==u).length===0){toast('يجب بقاء مدير فعّال واحد على الأقل',1);return false}
   if(isN){const p=$('#u_p',bg).value;if(p.length<4){toast('كلمة المرور 4 أحرف على الأقل',1);return false}const nu=makeUser(n,un,p,role);nu.canDel=$('#u_d',bg).checked;nu.active=act;DB.users.push(nu);logAct('إضافة مستخدم',n)}
   else{const old=o.name;Object.assign(u,{name:n,user:un,role,active:act,canDel:$('#u_d',bg).checked});logAct('تعديل مستخدم',n+(old!==n?' (كان '+old+')':''))}
   save();renderUsersTab(tb)}},{label:'إلغاء'}]})};
 $('#uAdd').onclick=()=>edit(null);
 tb.onclick=e=>{const b=e.target.closest('button');if(!b||!b.dataset)return;const id=+(b.dataset.e||b.dataset.p||b.dataset.x);const u=DB.users.find(x=>x.id===id);if(!u)return;
  if(b.dataset.e)edit(u);else if(b.dataset.p)changePwModal(u,true);
  else if(b.dataset.x)confirmBox('حذف المستخدم «'+u.name+'»؟ تبقى حركاته المسجلة.',()=>{DB.users=DB.users.filter(x=>x.id!==u.id);logAct('حذف مستخدم',u.name);save();renderUsersTab(tb)})}}
/* تبويب سجل الحركات */

const FONTS=[
 ['','تاهوما (الافتراضي)','Tahoma,"Segoe UI",Arial,sans-serif','Tahoma'],
 ['segoe','سيغو UI','"Segoe UI",Tahoma,Arial,sans-serif','Segoe UI'],

 ['verdana','فيردانا','Verdana,Tahoma,sans-serif','Verdana'],
 ['dubai','دبي','Dubai,"Segoe UI",Tahoma,sans-serif','Dubai'],
 ['majalla','سكّل مجلة','"Sakkal Majalla","Segoe UI",Tahoma,sans-serif','Sakkal Majalla'],
 ['simp','عربي مبسّط','"Simplified Arabic",Tahoma,sans-serif','Simplified Arabic'],

const FONT_DEF={family:'',size:100,weight:400,lh:1.5};

function fontOK(name){try{const c=document.createElement('canvas').getContext('2d');const t='مبيعات Abc123 ٤٥٦';const w=f=>{c.font='40px '+f;return c.measureText(t).width};return w(`"${name}",monospace`)!==w('monospace')||w(`"${name}",serif`)!==w('serif')}catch(e){return true}}
function applyFont(){
 const f=fontCfg(),r=document.documentElement.style;const fam=(FONTS.find(x=>x[0]===f.family)||FONTS[0])[2];
 r.setProperty('--ff',fam);r.setProperty('--fz',String(f.size/100));r.setProperty('--fw',String(f.weight));r.setProperty('--lh',String(f.lh));
}

 const f=fontCfg();const set=(k,v)=>{S().font=Object.assign(fontCfg(),{[k]:v});save();applyFont();renderFontTab(tb)};
 const SAMPLE='قائمة مبيعات رقم 125 — الزبون: أحمد — المبلغ 1,250,000 دينار / 750.50 $';
 tb.innerHTML=`<p class="muted" style="margin-top:0">اختر الخط والحجم والسماكة اللي يريحك. التغيير يشتغل فوراً على كل شاشات البرنامج، ويبقى محفوظ.</p>

 <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(250px,1fr))">${FONTS.map(x=>{const ok=!x[0]||fontOK(x[3]);return `<div class="fcard${f.family===x[0]?' on':''}${ok?'':' off'}" data-ff="${x[0]}" style="font-family:${x[2]}"><b>${x[1]}${f.family===x[0]?' ✓':''}</b><span>أحمد — مبيعات 1234567890</span>${ok?'':'<small style="font-family:Tahoma">غير موجود بجهازك</small>'}</div>`}).join('')}</div>
 <div class="hdr" style="margin-top:16px">
  <div class="f w2" style="grid-column:span 2"><label>حجم الخط: <b id="fzv">${f.size}%</b></label><input type="range" id="fz" min="85" max="140" step="5" value="${f.size}" style="padding:0"></div>
  <div class="f"><label>سماكة الخط</label><select id="fw"><option value="400"${f.weight==400?' selected':''}>عادي</option><option value="500"${f.weight==500?' selected':''}>متوسط</option><option value="600"${f.weight==600?' selected':''}>غامق</option></select></div>
  <div class="f"><label>تباعد الأسطر</label><select id="flh"><option value="1.35"${f.lh==1.35?' selected':''}>مضغوط</option><option value="1.5"${f.lh==1.5?' selected':''}>عادي</option><option value="1.7"${f.lh==1.7?' selected':''}>مريح</option></select></div>
 </div>
 <div class="bar" style="gap:6px">${[[90,'صغير'],[100,'عادي'],[115,'كبير'],[130,'كبير جداً']].map(([v,l])=>`<button class="btn s${f.size===v?' p':''}" data-sz="${v}">${l}</button>`).join('')}<button class="btn" id="fRs" style="margin-inline-start:auto">إرجاع الافتراضي</button></div>
 <div class="fprev"><div style="font-weight:700;margin-bottom:6px">معاينة</div><div>${SAMPLE}</div><div class="muted" style="margin-top:4px">ملاحظات: هذا نص تجريبي للمعاينة — 0123456789</div>
  <div class="tblw" style="margin-top:10px"><table><thead><tr><th>رمز المادة</th><th>اسم المادة</th><th class="n">الكمية</th><th class="n">السعر</th><th class="n">المبلغ</th></tr></thead><tbody><tr><td>1001</td><td>مادة تجريبية</td><td class="n">12</td><td class="n">1,500</td><td class="n">18,000</td></tr></tbody></table></div></div>`;
 tb.onclick=e=>{const c=e.target.closest('[data-ff]');if(c&&!c.classList.contains('off'))return set('family',c.dataset.ff);const s=e.target.closest('[data-sz]');if(s)return set('size',+s.dataset.sz);if(e.target.id==='fRs'){S().font=null;save();applyFont();renderFontTab(tb)}};
 $('#fz').oninput=e=>{S().font=Object.assign(fontCfg(),{size:+e.target.value});applyFont();$('#fzv').textContent=e.target.value+'%'};
 $('#fz').onchange=e=>{save();renderFontTab(tb)};

/* ========== خيارات المطور (المزامنة السحابية + قاعدة SQL) ========== */
const DEV_SUBS={db:'مكان قاعدة البيانات',sync:'المزامنة السحابية',sql:'قاعدة SQL'};
/* رمز المطور: يُخزَّن هنا مجزّأً فقط، ولا توجد واجهة لتغييره. يغيّره المبرمج بإعادة بناء البرنامج. */
const DEV_SALT='1b9d66ae3607d8bd',DEV_HASH='54e94102246f3d5680564660543be14c7031af6077ca41b9ed945f7c40c8b7d0';
let devFail=0,devLock=0;
const devSH=()=>[S().devSalt||DEV_SALT,S().devHash||DEV_HASH];
const devCheck=c=>{const[a,b]=devSH();return hashPw(String(c).trim(),a)===b};
let devUnlocked=false;
const devOK=()=>devUnlocked;
function renderDevTab(tb){
 if(!devOK()){
  tb.innerHTML=`<div class="opt-wrap"><div class="opt-card"><h4>خيارات المطور مقفلة</h4><p class="muted" style="margin:0 0 10px">أدخل الرمز السري الخاص بالمبرمج للدخول.</p><input type="password" id="devCode" autocomplete="off" inputmode="numeric" style="width:100%;padding:10px;box-sizing:border-box"><div id="devErr" style="color:var(--danger);min-height:20px;margin:6px 0;font-size:13px"></div><button class="btn p" id="devGo">فتح</button></div></div>`;
  const go=()=>{const e=$('#devErr',tb);if(Date.now()<devLock){e.textContent='محاولات كثيرة، انتظر قليلاً';return}
   if(devCheck($('#devCode',tb).value)){devFail=0;devUnlocked=true;logAct('خيارات المطور','فتح');renderDevTab(tb)}
   else{devFail++;logAct('خيارات المطور','رمز خاطئ');if(devFail>=5){devLock=Date.now()+30000;devFail=0;e.textContent='محاولات كثيرة، انتظر 30 ثانية'}else e.textContent='الرمز غير صحيح'}};
  $('#devGo',tb).onclick=go;$('#devCode',tb).onkeydown=e=>{if(e.key==='Enter')go()};return}
 const sub=DEV_SUBS[window._devSub]?window._devSub:'db';
 tb.innerHTML=`<div class="subtabs">${Object.keys(DEV_SUBS).map(k=>`<button data-sub="${k}" class="${k===sub?'on':''}">${DEV_SUBS[k]}</button>`).join('')}</div><div id="devBody"></div><div class="card" style="margin-top:14px;max-width:460px"><h4 style="margin:0 0 8px">تغيير الرمز السري</h4><div class="f"><label>الرمز الحالي</label><input type="password" id="dvOld" autocomplete="off"></div><div class="f"><label>الرمز الجديد (6 خانات أو أكثر)</label><input type="password" id="dvNew" autocomplete="off"></div><div class="f"><label>تأكيد الرمز الجديد</label><input type="password" id="dvNew2" autocomplete="off"></div><button class="btn p" id="dvSave" style="margin-top:10px">حفظ الرمز الجديد</button></div>`;
 $('#dvSave',tb).onclick=()=>{const o=$('#dvOld',tb).value,n=$('#dvNew',tb).value.trim(),n2=$('#dvNew2',tb).value.trim();
  if(!devCheck(o))return toast('الرمز الحالي غير صحيح',1);if(n.length<6)return toast('الرمز الجديد قصير (6 خانات على الأقل)',1);if(n!==n2)return toast('الرمزان غير متطابقين',1);
  const salt=Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>b.toString(16).padStart(2,'0')).join('');S().devSalt=salt;S().devHash=hashPw(n,salt);logAct('خيارات المطور','تغيير الرمز السري');save();
  ['dvOld','dvNew','dvNew2'].forEach(i=>$('#'+i,tb).value='');toast('تم تغيير الرمز السري')};

const SYNC_CFG_KEY='fv_sync_cfg',SYNC_ST_KEY='fv_sync_state';
const SYNC_COLS=[['sales','sale'],['purchases','purchase'],['transfers','transfer'],['cash','cash'],['persons',null],['items',null],['users',null]];
const SYNC_SET=['company','phone','address','rate','toman','rmb','roundTo','defWh','defPricing','defCur','defPay','cashOpenIqd','cashOpenUsd'];
const SYNC_META=['warehouses','groups','expAccts'];
let SY={cfg:null,st:{h:{},u:{},dirty:{},cur:'',last:0},status:'off',msg:'',busy:false,timer:0,tok:null,tokExp:0,uid:'',pulled:0};
function syLoad(){try{SY.cfg=JSON.parse(localStorage.getItem(SYNC_CFG_KEY)||'null')}catch(e){}try{const s=JSON.parse(localStorage.getItem(SYNC_ST_KEY)||'null');if(s)SY.st=Object.assign(SY.st,s)}catch(e){}SY.status=SY.cfg&&SY.cfg.on?'idle':'off'}
function syPersist(){try{localStorage.setItem(SYNC_ST_KEY,JSON.stringify(SY.st))}catch(e){}}
function syCfgSave(c){SY.cfg=c;try{if(c)localStorage.setItem(SYNC_CFG_KEY,JSON.stringify(c));else localStorage.removeItem(SYNC_CFG_KEY)}catch(e){}}
function syReset(){SY.st={h:{},u:{},dirty:{},cur:'',last:0};SY.tok=null;SY.uid='';try{localStorage.removeItem(SYNC_ST_KEY)}catch(e){}}
const syRid=()=>[...crypto.getRandomValues(new Uint8Array(7))].map(b=>b.toString(36).padStart(2,'0')).join('').slice(0,10);
function syHash(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)+s.length}
/* كل السجلات الحالية: المفتاح -> {col,obj} */
function syRecs(){const m=new Map();
 for(const[col]of SYNC_COLS)for(const o of DB[col]||[]){if(!o._k)o._k=syRid();m.set(col+'.'+o._k,{col,obj:o,val:o})}
 for(const k of SYNC_META)m.set('meta.'+k,{col:'meta',val:DB[k]});
 const set={};for(const k of SYNC_SET)set[k]=S()[k];m.set('meta.settings',{col:'meta',val:set});
 for(const r of DB.log||[]){if(!r._k)r._k=syRid();m.set('log.'+r._k,{col:'log',obj:r,val:r})}
 return m}
const syPrefix=k=>k.slice(0,k.indexOf('.'));
function syScan(){const recs=syRecs(),now=Date.now();let n=0;
 for(const[k,r]of recs){const h=syHash(JSON.stringify(r.val));if(SY.st.h[k]!==h){SY.st.h[k]=h;SY.st.u[k]=now+(n++%1000)/1000;SY.st.dirty[k]=1}}
 for(const k of Object.keys(SY.st.h)){if(!recs.has(k)&&!k.startsWith('meta.')&&!k.startsWith('log.')){delete SY.st.h[k];SY.st.u[k]=now;SY.st.dirty[k]='del'}}
 syPersist()}
/* ---- الاتصال ---- */
const syBase=()=>({fs:(SY.cfg.fsBase||'https://firestore.googleapis.com'),au:(SY.cfg.authBase||'https://identitytoolkit.googleapis.com')});
async function syFetch(url,body,tok){const r=await fetch(url,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},tok?{Authorization:'Bearer '+tok}:{}),body:JSON.stringify(body)});
 let j=null;try{j=await r.json()}catch(e){}if(!r.ok){const m=(j&&(j.error&&(j.error.message||j.error.status)))||('HTTP '+r.status);const e=new Error(m);e.http=r.status;throw e}return j}
async function syAuth(){if(SY.tok&&Date.now()<SY.tokExp)return;const c=SY.cfg,b=syBase();
 const j=await syFetch(`${b.au}/v1/accounts:signInWithPassword?key=${encodeURIComponent(c.apiKey)}`,{email:c.email,password:c.password,returnSecureToken:true});
 SY.tok=j.idToken;SY.uid=j.localId;SY.tokExp=Date.now()+(+j.expiresIn||3600)*1000-120000}
const syParent=()=>`projects/${SY.cfg.projectId}/databases/(default)/documents/orgs/${SY.uid}`;
const syDocId=k=>k.replace(/[^A-Za-z0-9._-]/g,'_');
async function syPush(){const keys=Object.keys(SY.st.dirty);if(!keys.length)return 0;const recs=syRecs(),b=syBase();let done=0;
 for(let i=0;i<keys.length;i+=200){const part=keys.slice(i,i+200);const writes=[];
  for(const k of part){const del=SY.st.dirty[k]==='del';const r=recs.get(k);if(!del&&!r)continue;
   writes.push({update:{name:`${syParent()}/records/${syDocId(k)}`,fields:{k:{stringValue:k},j:{stringValue:del?'':JSON.stringify(r.val)},u:{doubleValue:SY.st.u[k]||Date.now()},d:{booleanValue:del}}},updateTransforms:[{fieldPath:'s',setToServerValue:'REQUEST_TIME'}]})}
  if(writes.length)await syFetch(`${b.fs}/v1/projects/${SY.cfg.projectId}/databases/(default)/documents:commit`,{writes},SY.tok);
  for(const k of part)delete SY.st.dirty[k];done+=part.length;syPersist()}
 return done}
function syApply(k,rec){
 const col=syPrefix(k);const lu=SY.st.u[k]||0;
 if(SY.st.dirty[k]&&lu>=rec.u)return false;
 if(col==='meta'){const nm=k.slice(5);if(rec.d)return false;const v=JSON.parse(rec.j);
  if(nm==='settings'){Object.assign(S(),v)}else DB[nm]=v;
  SY.st.h[k]=syHash(JSON.stringify(v));SY.st.u[k]=rec.u;delete SY.st.dirty[k];return true}
 const arr=col==='log'?(DB.log=DB.log||[]):DB[col];if(!arr)return false;const id=k.slice(col.length+1);
 const i=arr.findIndex(o=>o._k===id);
 if(rec.d){if(i>=0)arr.splice(i,1);delete SY.st.h[k];SY.st.u[k]=rec.u;delete SY.st.dirty[k];return true}
 const v=JSON.parse(rec.j);v._k=id;
 if(i>=0){const o=arr[i];for(const x of Object.keys(o))delete o[x];Object.assign(o,v)}else arr.push(v);
 SY.st.h[k]=syHash(JSON.stringify(v));SY.st.u[k]=rec.u;delete SY.st.dirty[k];return true}
async function syPull(){const b=syBase();let total=0,guard=0;
 for(;;){const q={structuredQuery:{from:[{collectionId:'records'}],orderBy:[{field:{fieldPath:'s'},direction:'ASCENDING'}],limit:300}};
  if(SY.st.cur)q.structuredQuery.where={fieldFilter:{field:{fieldPath:'s'},op:'GREATER_THAN',value:{timestampValue:SY.st.cur}}};
  const res=await syFetch(`${b.fs}/v1/${syParent()}:runQuery`,q,SY.tok);const docs=(res||[]).filter(x=>x.document).map(x=>x.document);
  SY.pulled=0;let ch=0;
  for(const d of docs){const f=d.fields||{};const k=f.k&&f.k.stringValue;if(!k)continue;
   const rec={j:f.j?f.j.stringValue:'',u:f.u?(+(f.u.doubleValue??f.u.integerValue)):0,d:!!(f.d&&f.d.booleanValue)};
   try{if(syApply(k,rec))ch++}catch(e){console.error('sync apply',k,e)}
   const s=f.s&&f.s.timestampValue;if(s&&(!SY.st.cur||s>SY.st.cur))SY.st.cur=s}
  total+=ch;syPersist();if(docs.length<300||++guard>200)break}
 return total}
/* منع تكرار أرقام القوائم بين الأجهزة */
function syFixNumbers(){let ch=0;
 for(const[col,sq]of SYNC_COLS){if(!sq)continue;const seen={};const arr=(DB[col]||[]).slice().sort((a,b)=>(a.cts||0)-(b.cts||0));
  for(const d of arr){if(seen[d.no]){d.no=DB.seq[sq]++;ch++}seen[d.no]=1}
  const mx=Math.max(0,...DB[col].map(d=>+d.no||0));if(DB.seq[sq]<=mx)DB.seq[sq]=mx+1}
 const mp=Math.max(0,...DB.persons.map(p=>+p.id||0));if(DB.seq.person<=mp)DB.seq.person=mp+1;
 const mi=Math.max(0,...DB.items.map(i=>+i.code||0).filter(isFinite));if(DB.seq.item<=mi)DB.seq.item=mi+1;
 const mt=Math.max(0,...[...DB.sales,...DB.purchases,...DB.transfers,...DB.cash].map(d=>+d.ts||0));if(DB.seq.ts<=mt)DB.seq.ts=mt+1;
 return ch}
