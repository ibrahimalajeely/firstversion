/* ========== قاعدة SQL: تصدير واستيراد ========== */
const SQL_SCHEMA="-- قاعدة بيانات «التحدي» — متوافقة مع SQLite وأغلب قواعد SQL\nCREATE TABLE IF NOT EXISTS warehouses(id INTEGER PRIMARY KEY, name TEXT NOT NULL);\nCREATE TABLE IF NOT EXISTS item_groups(name TEXT PRIMARY KEY);\nCREATE TABLE IF NOT EXISTS persons(id INTEGER PRIMARY KEY, name TEXT NOT NULL, type TEXT, phone TEXT, area TEXT, open_iqd REAL DEFAULT 0, open_usd REAL DEFAULT 0, extra TEXT);\nCREATE TABLE IF NOT EXISTS items(code TEXT PRIMARY KEY, name TEXT NOT NULL, grp TEXT, packing REAL DEFAULT 1, cost_usd REAL DEFAULT 0, w_usd REAL DEFAULT 0, w_iqd REAL DEFAULT 0, r_iqd REAL DEFAULT 0, reorder REAL DEFAULT 0, alert INTEGER DEFAULT 0, extra TEXT);\nCREATE TABLE IF NOT EXISTS item_open(item_code TEXT, warehouse_id INTEGER, qty REAL);\nCREATE TABLE IF NOT EXISTS sales(no INTEGER PRIMARY KEY, date TEXT, person_id INTEGER, warehouse_id INTEGER, cur TEXT, pay TEXT, pricing TEXT, rate REAL, notes TEXT, disc_mode TEXT, disc_pct REAL, disc_amt REAL, paid_cash REAL, paid_master REAL, user_name TEXT, time TEXT, ts INTEGER, extra TEXT);\nCREATE TABLE IF NOT EXISTS sale_lines(sale_no INTEGER, line_no INTEGER, code TEXT, name TEXT, carton REAL, packing REAL, qty REAL, price REAL, cost_usd REAL, extra TEXT);\nCREATE TABLE IF NOT EXISTS purchases(no INTEGER PRIMARY KEY, date TEXT, person_id INTEGER, warehouse_id INTEGER, cur TEXT, pay TEXT, ptype TEXT, rate REAL, notes TEXT, disc_mode TEXT, disc_pct REAL, disc_amt REAL, paid_cash REAL, paid_master REAL, expenses REAL, recv_date TEXT, user_name TEXT, time TEXT, ts INTEGER, extra TEXT);\nCREATE TABLE IF NOT EXISTS purchase_lines(purchase_no INTEGER, line_no INTEGER, code TEXT, name TEXT, carton REAL, packing REAL, qty REAL, price REAL, extra TEXT);\nCREATE TABLE IF NOT EXISTS transfers(no INTEGER PRIMARY KEY, date TEXT, from_wh INTEGER, to_wh INTEGER, notes TEXT, user_name TEXT, time TEXT, ts INTEGER, extra TEXT);\nCREATE TABLE IF NOT EXISTS transfer_lines(transfer_no INTEGER, line_no INTEGER, code TEXT, name TEXT, qty REAL, extra TEXT);\nCREATE TABLE IF NOT EXISTS cash(no INTEGER PRIMARY KEY, date TEXT, type TEXT, acct TEXT, person_id INTEGER, exp_name TEXT, pay TEXT, rate REAL, usd REAL, iqd_cash REAL, iqd_master REAL, disc_usd REAL, disc_iqd REAL, party TEXT, notes TEXT, user_name TEXT, time TEXT, ts INTEGER, extra TEXT);\nCREATE TABLE IF NOT EXISTS app_state(k TEXT PRIMARY KEY, v TEXT);\nCREATE INDEX IF NOT EXISTS ix_sale_lines ON sale_lines(sale_no);\nCREATE INDEX IF NOT EXISTS ix_purchase_lines ON purchase_lines(purchase_no);\nCREATE INDEX IF NOT EXISTS ix_sales_date ON sales(date);\nCREATE INDEX IF NOT EXISTS ix_sales_person ON sales(person_id);\nCREATE INDEX IF NOT EXISTS ix_cash_date ON cash(date);\nCREATE VIEW IF NOT EXISTS v_sale_totals AS SELECT s.no, s.date, p.name AS customer, s.cur, ROUND(SUM(l.qty*l.price)*(1-CASE WHEN s.disc_mode='pct' THEN s.disc_pct/100.0 ELSE 0 END)-CASE WHEN s.disc_mode='pct' THEN 0 ELSE s.disc_amt END,2) AS net FROM sales s JOIN sale_lines l ON l.sale_no=s.no LEFT JOIN persons p ON p.id=s.person_id GROUP BY s.no;\nCREATE VIEW IF NOT EXISTS v_stock AS SELECT i.code, i.name, COALESCE((SELECT SUM(qty) FROM item_open o WHERE o.item_code=i.code),0)+COALESCE((SELECT SUM(l.qty) FROM purchase_lines l WHERE l.code=i.code),0)-COALESCE((SELECT SUM(l.qty) FROM sale_lines l WHERE l.code=i.code),0) AS stock FROM items i;\n";

 live(DB.cash).forEach(c=>ins('cash',['no','date','type','acct','person_id','exp_name','pay','rate','usd','iqd_cash','iqd_master','disc_usd','disc_iqd','party','notes','user_name','time','ts','extra'],[c.no,c.date,c.type,c.acct,c.personId===''?null:c.personId,c.expName||'',c.pay||'',num(c.rate),num(c.usd),num(c.iqdCash),num(c.iqdMaster),num(c.discUsd),num(c.discIqd),c.party||'',c.notes||'',c.user||'',c.time||'',c.ts||0,xt(c,K_C)]));
 if(replace){const core={v:DB.v,settings:DB.settings,expAccts:DB.expAccts,users:DB.users,log:DB.log,waiting:DB.waiting,seq:DB.seq};const tomb={};['sales','purchases','transfers','cash'].forEach(k=>tomb[k]=DB[k].filter(x=>x.deleted));

function sqlParse(text){
 const T={};let i=0;const n=text.length;
 const ws=()=>{for(;;){while(i<n&&/\s/.test(text[i]))i++;if(text[i]==='-'&&text[i+1]==='-'){while(i<n&&text[i]!=='\n')i++}else if(text[i]==='/'&&text[i+1]==='*'){const e=text.indexOf('*/',i+2);i=e<0?n:e+2}else break}};
 const skipStmt=()=>{while(i<n&&text[i]!==';'){if(text[i]==="'"){i++;while(i<n){if(text[i]==="'"){if(text[i+1]==="'"){i+=2;continue}break}i++}}i++}i++};
 const ident=()=>{ws();let s='';if(text[i]==='"'||text[i]==='`'||text[i]==='['){const q=text[i]==='['?']':text[i];i++;while(i<n&&text[i]!==q)s+=text[i++];i++;return s}while(i<n&&/[\w.]/.test(text[i]))s+=text[i++];return s};
 const val=()=>{ws();const c=text[i];if(c==="'"){i++;let s='';while(i<n){if(text[i]==="'"){if(text[i+1]==="'"){s+="'";i+=2;continue}i++;break}s+=text[i++]}return s}
  let s='';while(i<n&&text[i]!==','&&text[i]!==')')s+=text[i++];s=s.trim();if(/^null$/i.test(s))return null;const x=Number(s);return isNaN(x)?s:x};
 while(i<n){ws();if(i>=n)break;
  if(/^insert\s+(or\s+\w+\s+)?into/i.test(text.slice(i,i+40))){
   i=i+text.slice(i,i+40).toLowerCase().indexOf('into')+4;const t=ident().toLowerCase();ws();const cols=[];
   if(text[i]==='('){i++;for(;;){cols.push(ident().toLowerCase());ws();if(text[i]===','){i++;continue}i++;break}}
   ws();i+=6;/* VALUES */
   for(;;){ws();if(text[i]!=='(')break;i++;const row={};let k=0;for(;;){row[cols[k++]]=val();ws();if(text[i]===','){i++;continue}i++;break}(T[t]=T[t]||[]).push(row);ws();if(text[i]===','){i++;continue}break}
   ws();if(text[i]===';')i++}
  else skipStmt()}
 return T}
function sqlBuild(T,opt){
 const g=t=>T[t]||[];const by=(t,k)=>{const m={};g(t).forEach(r=>(m[r[k]]=m[r[k]]||[]).push(r));for(const x in m)m[x].sort((a,b)=>(a.line_no||0)-(b.line_no||0));return m};
 const me=opt&&opt.me!==undefined?opt.me:curName();const RT=opt&&opt.rate||S().rate;const ex=(o,r)=>{if(r.extra){try{Object.assign(o,JSON.parse(r.extra))}catch(e){}}return o};const pid=v=>v===null||v===undefined?'':v;
 const out={};
 out.warehouses=g('warehouses').map(w=>({id:+w.id,name:String(w.name)}));
 out.groups=g('item_groups').map(r=>String(r.name));
 out.persons=g('persons').map(p=>ex({id:+p.id,name:String(p.name),type:p.type||'customer',phone:p.phone||'',area:p.area||'',openIqd:num(p.open_iqd),openUsd:num(p.open_usd)},p));
 const op=by('item_open','item_code');
 out.items=g('items').map(i=>{const o={};(op[i.code]||[]).forEach(r=>{o[r.warehouse_id]=num(r.qty)});return ex({code:String(i.code),name:String(i.name),group:i.grp||'',packing:num(i.packing)||1,cost:num(i.cost_usd),wUsd:num(i.w_usd),wIqd:num(i.w_iqd),rIqd:num(i.r_iqd),reorder:num(i.reorder),alert:!!num(i.alert),open:o},i)});
 const sl=by('sale_lines','sale_no');
 out.sales=g('sales').map(s=>ex({no:+s.no,ts:+s.ts||0,date:s.date,personId:pid(s.person_id),wh:+s.warehouse_id,cur:s.cur,pay:s.pay||'نقد',pricing:s.pricing||'جملة',ptype:'محلي',rate:num(s.rate)||RT,notes:s.notes||'',discMode:s.disc_mode||'pct',discPct:num(s.disc_pct),discAmt:num(s.disc_amt),paidCash:num(s.paid_cash),paidMaster:num(s.paid_master),paidManual:true,expenses:0,recvDate:s.date,user:s.user_name||me,time:s.time||'',
  lines:(sl[s.no]||[]).map(l=>ex({code:String(l.code),name:l.name,carton:num(l.carton),packing:num(l.packing)||1,qty:num(l.qty),price:num(l.price),note:'',costUsd:num(l.cost_usd),wUsd:0,wIqd:0,rIqd:0},l))},s));
 const pl=by('purchase_lines','purchase_no');
 out.purchases=g('purchases').map(s=>ex({no:+s.no,ts:+s.ts||0,date:s.date,personId:pid(s.person_id),wh:+s.warehouse_id,cur:s.cur,pay:s.pay||'نقد',pricing:'جملة',ptype:s.ptype||'محلي',rate:num(s.rate)||RT,notes:s.notes||'',discMode:s.disc_mode||'pct',discPct:num(s.disc_pct),discAmt:num(s.disc_amt),paidCash:num(s.paid_cash),paidMaster:num(s.paid_master),paidManual:true,expenses:num(s.expenses),recvDate:s.recv_date||s.date,user:s.user_name||me,time:s.time||'',
  lines:(pl[s.no]||[]).map(l=>ex({code:String(l.code),name:l.name,carton:num(l.carton),packing:num(l.packing)||1,qty:num(l.qty),price:num(l.price),note:'',costUsd:0,wUsd:0,wIqd:0,rIqd:0},l))},s));
 const tl=by('transfer_lines','transfer_no');
 out.transfers=g('transfers').map(s=>ex({no:+s.no,ts:+s.ts||0,date:s.date,from:+s.from_wh,to:+s.to_wh,notes:s.notes||'',user:s.user_name||me,time:s.time||'',lines:(tl[s.no]||[]).map(l=>ex({code:String(l.code),name:l.name,qty:num(l.qty)},l))},s));
 out.cash=g('cash').map(c=>ex({no:+c.no,ts:+c.ts||0,date:c.date,type:c.type,acct:c.acct,personId:pid(c.person_id),expName:c.exp_name||'',pay:c.pay||'نقد',rate:num(c.rate)||RT,usd:num(c.usd),iqdCash:num(c.iqd_cash),iqdMaster:num(c.iqd_master),discUsd:num(c.disc_usd),discIqd:num(c.disc_iqd),party:c.party||'الصندوق',notes:c.notes||'',user:c.user_name||me,time:c.time||''},c));
 return out}
function sqlApply(o){
 if(o.warehouses.length)DB.warehouses=o.warehouses;DB.groups=o.groups;DB.persons=o.persons;DB.items=o.items;DB.sales=o.sales;DB.purchases=o.purchases;DB.transfers=o.transfers;DB.cash=o.cash;
 if(!DB.warehouses.some(w=>w.id==S().defWh))S().defWh=DB.warehouses[0]?DB.warehouses[0].id:1;
 const mx=(a,f)=>a.reduce((m,x)=>Math.max(m,+f(x)||0),0);
 DB.seq.sale=mx(o.sales,x=>x.no)+1;DB.seq.purchase=mx(o.purchases,x=>x.no)+1;DB.seq.transfer=mx(o.transfers,x=>x.no)+1;DB.seq.cash=mx(o.cash,x=>x.no)+1;

const EN_MAP=(()=>{const m=new Map();EN_RAW.split('\n').forEach(l=>{const i=l.indexOf('|');if(i>0)m.set(l.slice(0,i).trim(),l.slice(i+1).trim())});return m})();
const EN_KEYS=[...EN_MAP.keys()].filter(k=>k.length>=3).sort((a,b)=>b.length-a.length);
const ARL='؀-ۿ';
const EN_RX=EN_KEYS.map(k=>[new RegExp('(?<!['+ARL+'])'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![' + ARL + '])','g'),EN_MAP.get(k)]);
const hasAr=s=>/[؀-ۿ]/.test(s);
const trStr=s=>{const t=s.trim();if(!t||!hasAr(t))return s;const ex=EN_MAP.get(t);if(ex!==undefined)return s.replace(t,ex);
 let r=s;for(const [rx,en] of EN_RX){if(!hasAr(r))break;r=r.replace(rx,en)}return r};
const TR_TXT=new WeakMap(),TR_ATTR=new WeakMap();let TR_ON=false,TR_BUSY=false,TR_MO=null;
function trNode(n){
 if(n.nodeType===3){if(TR_TXT.has(n)&&n.data===TR_TXT.get(n).en)return;const o=n.data;if(!hasAr(o))return;const e=trStr(o);if(e!==o){TR_TXT.set(n,{ar:o,en:e});n.data=e}return}
 if(n.nodeType!==1)return;const tg=n.tagName;if(tg==='SCRIPT'||tg==='STYLE'||tg==='TEXTAREA')return;
 for(const a of ['placeholder','title','aria-label']){const v=n.getAttribute&&n.getAttribute(a);if(v&&hasAr(v)){const e=trStr(v);if(e!==v){const m=TR_ATTR.get(n)||{};if(!m[a])m[a]=v;TR_ATTR.set(n,m);n.setAttribute(a,e)}}}
 for(const c of n.childNodes)trNode(c)}
function trUndo(n){
 if(n.nodeType===3){const r=TR_TXT.get(n);if(r){n.data=r.ar;TR_TXT.delete(n)}return}
 if(n.nodeType!==1)return;const m=TR_ATTR.get(n);if(m){for(const a in m)n.setAttribute(a,m[a]);TR_ATTR.delete(n)}
 for(const c of n.childNodes)trUndo(c)}
function applyLang(){
 const en=(S().lang||'ar')==='en';const h=document.documentElement;
 h.lang=en?'en':'ar';h.dir=en?'ltr':'rtl';
 if(TR_MO){TR_MO.disconnect();TR_MO=null}
 if(en){TR_ON=true;TR_BUSY=true;trNode(document.body);TR_BUSY=false;
  TR_MO=new MutationObserver(ms=>{if(TR_BUSY)return;TR_BUSY=true;try{for(const m of ms){if(m.type==='childList')m.addedNodes.forEach(trNode);else if(m.type==='characterData')trNode(m.target)}}finally{TR_BUSY=false}});
  TR_MO.observe(document.body,{childList:true,subtree:true,characterData:true})}
 else if(TR_ON){TR_ON=false;trUndo(document.body)}
 document.title=en?'Al Tahaddi':'التحدي'}

const ACCENTS=[['rose','#7a5650','#f5dfdb'],['green','#476344','#c9e5c4'],['blue','#3c5f90','#d4e2fb'],['teal','#437470','#dff3f1'],['olive','#5d5530','#e3d8a5'],['purple','#6b5b7b','#eadcf2']];
function applyAccent(){
 let st=document.getElementById('userAccent');if(!st){st=document.createElement('style');st.id='userAccent';const uc=document.getElementById('userColors');uc?document.head.insertBefore(st,uc):document.head.appendChild(st)}
 const a=S().accent||'teal';if(a==='teal'){st.textContent='';return}
 const x=(ACCENTS.find(r=>r[0]===a)||ACCENTS[3])[1];
 const dk=S().theme==='dark'||(!S().theme&&matchMedia('(prefers-color-scheme:dark)').matches);
 st.textContent=dk?`:root:root{--brand:color-mix(in srgb,${x} 55%,#fff);--brand-d:color-mix(in srgb,${x} 45%,#000);--brand-l:color-mix(in srgb,${x} 30%,#1f262b);--btn-ink:#10181c}`
  :`:root:root{--brand:${x};--brand-d:color-mix(in srgb,${x} 78%,#000);--brand-l:color-mix(in srgb,${x} 12%,#fff);--btn-ink:#fff}`}
function renderOptionsTab(tb){
 const lang=S().lang||'ar',th=S().theme==='dark'?'dark':S().theme==='light'?'light':'',ac=S().accent||'teal';
 const seg=(id,items,cur)=>`<div class="seg" id="${id}">${items.map(([k,l])=>`<button data-v="${k}" class="${k===cur?'on':''}">${k===cur?'<svg viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19 7"/></svg>':''}${l}</button>`).join('')}</div>`;
 tb.innerHTML=`<div class="opt-wrap">
 <div class="opt-card"><h4>اللغة</h4><select id="optLang"><option value="ar"${lang==='ar'?' selected':''}>Ar - العربية</option><option value="en"${lang==='en'?' selected':''}>En - English</option></select>
  ${lang==='en'?'<div class="muted" style="margin-top:8px;font-size:12px">English covers the main screens, buttons and menus. Some long messages and user data stay as entered.</div>':''}</div>
 <div class="opt-card"><h4>المظهر</h4>${seg('optTh',[['','النظام'],['light','فاتح'],['dark','داكن']],th)}</div>
 <div class="opt-card"><h4>لون السمة</h4><div class="swatches" id="optAc">${ACCENTS.map(([k,m,l])=>`<button data-v="${k}" class="sw${k===ac?' on':''}" style="--sw-l:${l};--sw-m:${m}" aria-label="${k}">${k===ac?'<svg viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19 7"/></svg>':''}</button>`).join('')}</div></div></div>`;
 $('#optLang').onchange=e=>{S().lang=e.target.value;logAct('تعديل إعدادات','اللغة: '+S().lang);save();applyLang();route()};
 $('#optTh').onclick=e=>{const b=e.target.closest('button');if(!b)return;S().theme=b.dataset.v;logAct('تعديل إعدادات','المظهر: '+(b.dataset.v||'النظام'));save();applyTheme();renderOptionsTab(tb)};
 $('#optAc').onclick=e=>{const b=e.target.closest('button');if(!b)return;S().accent=b.dataset.v;logAct('تعديل إعدادات','لون السمة: '+b.dataset.v);save();applyAccent();renderOptionsTab(tb)};
 if(TR_ON){TR_BUSY=true;trNode(tb);TR_BUSY=false}
}

function parseCSV(text){
 const rows=[];let r=[],f='',q=false;text=text.replace(/^﻿/,'');
 for(let i=0;i<text.length;i++){const c=text[i];
  if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;else if(c===','||c===';'||c==='\t'){r.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;r.push(f);f='';if(r.some(x=>x.trim()))rows.push(r);r=[]}else f+=c}
 r.push(f);if(r.some(x=>x.trim()))rows.push(r);return rows;
}

  if(tab==='bak'){tb.innerHTML=`<p>بياناتك محفوظة داخل المتصفح على هذا الجهاز. خذ نسخة احتياطية بشكل دوري، وخاصة قبل مسح بيانات المتصفح.</p><div class="bar"><button class="btn p" id="bx">تحميل نسخة احتياطية</button><label class="btn">استرجاع من نسخة<input type="file" id="bi" accept=".json" style="display:none"></label><button class="btn d" id="br">مسح كل البيانات</button></div><p class="muted" id="bs"></p>`;
   $('#bs').textContent=storageOK?'التخزين بالمتصفح يعمل.':'تنبيه: التخزين بالمتصفح غير متاح حالياً، البيانات تُفقد عند إغلاق الصفحة. حمّل نسخة احتياطية.';
   $('#bx').onclick=()=>download('نسخة-احتياطية-'+today()+'.json',JSON.stringify(DB),'application/json');
   $('#bi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.settings||!d.items)throw 0;confirmBox('سيتم استبدال كل البيانات الحالية بالنسخة'+(SY.cfg&&SY.cfg.on?' (والمزامنة مفعلة: سيُطبَّق الاسترجاع على كل الأجهزة)':'')+'. متابعة؟',()=>{if(!d.users||!d.users.length)d.users=DB.users;d.log=(d.log||[]);const me=CU.id;DB=d;logAct('استرجاع نسخة احتياطية','');save();const u=DB.users.find(x=>x.id===me&&x.active);if(!u){toast('تم الاسترجاع. سجّل الدخول من جديد');return logout()}CU=u;refreshLists();applyTheme();mountUserBox();toast('تم الاسترجاع');render()})}catch(x){toast('ملف غير صالح',1)}};r.readAsText(f)};
   $('#br').onclick=()=>confirmBox('سيتم حذف كل البيانات نهائياً (بما فيها المستخدمون). هل أنت متأكد؟',()=>{DB=fresh();SYNC_BUSY=true;save();syReset();syCfgSave(null);setSession(null);location.reload()})}
 }
 render();
}

/* ========== الرئيسية ========== */
function viewHome(){
 const t=today();const sl=live(DB.sales).filter(s=>s.date===t);const cb=cashBalance();
 let recv=0,owe=0;for(const p of DB.persons){const b=balanceOf(p.id);if(b.iqd>0)recv+=b.iqd;else owe-=b.iqd}
 const m=stockMap();const low=DB.items.filter(i=>num(i.reorder)>0&&stockOf(m,i.code)<=num(i.reorder)).length;
 const tile=(h,ic,tt,s)=>`<a class="tile" href="#${h}" style="text-decoration:none;color:inherit">${ICON[ic]}<b>${tt}</b><span>${s}</span></a>`;
 $('#view').innerHTML=`<div class="top"><h2>الرئيسية</h2>${hdrDateHTML(t)}</div>
 <div class="grid tiles">${tile('sale','sale','المبيعات','قوائم البيع')}${tile('purchase','buy','المشتريات','قوائم الشراء')}${tile('transfer','move','النقل المخزني','بين المخازن')}${tile('cash','cash','الصندوق','القبض والصرف')}${tile('reports','rep','التقارير','زبائن، مواد، صندوق، أرباح')}${tile('settings','set','إعدادات النظام','الصرف، المخازن، النسخ')}</div>
 <div class="grid stats"><div class="stat"><span>مبيعات اليوم (${sl.length} قائمة)</span><b>${fmt(sl.filter(s=>s.cur!=='دولار').reduce((a,s)=>a+docTotals(s).net,0))} دينار</b></div>
 <div class="stat"><span>رصيد الصندوق بالدينار</span><b>${fmt(cb.iqd)}</b></div><div class="stat"><span>رصيد الصندوق بالدولار</span><b>${fmt(cb.usd,2)}</b></div>
 <div class="stat"><span>المطلوب من الزبائن (دينار)</span><b>${fmt(recv)}</b></div><div class="stat"><span>المطلوب للمجهزين (دينار)</span><b>${fmt(owe)}</b></div>
 <div class="stat ${low?'neg':''}"><span>مواد دون حد إعادة الطلب</span><b>${low}</b></div></div>
 ${DB.items.length?'':'<div class="note">للبدء: أضف المواد من «المواد»، والزبائن من «الزبائن والمجهزون»، أو استوردهم من ملف CSV عبر الإعدادات.</div>'}
 ${storageOK?'':'<div class="note" style="margin-top:8px">التخزين بالمتصفح غير متاح، حمّل نسخة احتياطية من الإعدادات.</div>'}`;
}

/* ========== التوجيه ========== */
function applyTheme(){const t=S().theme;if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme');applyColors();applyAccent();applyFont()}
const ROUTES={home:viewHome,sale:()=>viewDoc('sale'),purchase:()=>viewDoc('purchase'),transfer:()=>viewTransfer(),cash:()=>viewCash(),persons:viewPersons,items:viewItems,reports:viewReports,settings:viewSettings};
function route(){if(!CU)return;if((location.hash||'')!=='#settings')devUnlocked=false;document.body.classList.remove('nav-open');const h=(location.hash||'#home').slice(1);const r=ROUTES[h]||viewHome;refreshLists();$$('.side a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+h));const ov=$('#view');ov.replaceWith(ov.cloneNode(false));document.body.dataset.screen=h;try{r()}catch(e){console.error(e);$('#view').innerHTML='<div class="card"><b>حدث خطأ:</b> '+esc(e.message)+'</div>'};mountDW()}
window.addEventListener('hashchange',route);
document.addEventListener('DOMContentLoaded',()=>{$('#menuBtn').onclick=()=>document.body.classList.toggle('nav-open');$('#scrim').onclick=()=>document.body.classList.remove('nav-open');applyTheme();applyLang();setInterval(dwTick,20000);syStart();if(restoreSession())enter();else showGate()});

/* ===== تثبيت كتطبيق على الموبايل (PWA) عند التشغيل من رابط https ===== */
if(/^https?:/.test(location.protocol)){
 const l=document.createElement('link');l.rel='manifest';l.href='manifest.webmanifest';document.head.appendChild(l);
 if('serviceWorker' in navigator&&!FV_HOST)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
